# =====================================================
# pyproject.toml for BoxMOT
# =====================================================

#########################
# UV-specific Overrides #
#########################

[tool.uv]
preview = true
required-version = "==0.12.4"
conflicts = [
  [
    { extra = "cpu" },
    { extra = "cu130" },
  ],
  [
    { group = "service-runtime" },
    { extra = "cu130" },
  ],
]
extra-build-dependencies = { yolox = ["setuptools", { requirement = "torch", match-runtime = true }] }

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cpu", group = "service-runtime" },
  { index = "pytorch-cu130", extra = "cu130" },
]
torchvision = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cpu", group = "service-runtime" },
  { index = "pytorch-cu130", extra = "cu130" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

# Override yolox's outdated dependencies
[[tool.uv.dependency-metadata]]
name          = "yolox"
version       = "0.3.0"
requires-dist = [
  "onnx>=1.17.0",
  "onnxsim>=0.4.33,<0.5 ; python_version < '3.12'",
  "onnxsim-prebuilt>=0.4.36.post1 ; python_version >= '3.12'",
  "tabulate",
]

[tool.ruff]
line-length = 120
exclude = [".tox", "*.egg", "build", "temp"]

[tool.ruff.lint]
select = ["E", "W", "F", "I"]
ignore = ["E731", "F405", "E402", "E741"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [
  "datasets/mot",
  "datasets/reid",
  "runs",
]

##############
# Build System #
##############

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
# Native libraries may be produced inside their package directories by release
# and container builders. Include those platform artifacts even though normal
# editable-build outputs are ignored by Git; clean source wheels are unchanged
# when no library exists.
artifacts = [
  "/boxmot/native/cpp/**/*.so",
  "/boxmot/native/cpp/**/*.dylib",
  "/boxmot/native/cpp/**/*.dll",
  "/boxmot/native/cpp/**/*.pyd",
]
exclude = [
  "/artifacts/**",
  "/builds/**",
  "/datasets/**",
  "/boxmot/**/.staging/**",
  "/boxmot/**/*.npy",
  "/boxmot/**/*.npz",
  "/boxmot/**/*.parquet",
  "/boxmot/**/repo-to-text_*.txt",
  "/runs/**",
]

[tool.hatch.build.targets.sdist]
include = [
  "/boxmot",
  "/LICENSE",
  "/README.md",
  "/pyproject.toml",
]

[tool.hatch.build.targets.wheel]
packages = ["boxmot"]

###########
# Project #
###########

[project]
name            = "boxmot"
version         = "24.0.0"
description     = "BoxMOT: pluggable SOTA tracking modules for segmentation, object detection and pose estimation models"
readme          = "README.md"
requires-python = ">=3.10,<3.14"
license         = { text = "AGPL-3.0" }

authors = [
  { name = "Mikel Broström" },
]

classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Education",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Image Recognition",
  "Topic :: Scientific/Engineering :: Image Processing",
]

keywords = [
  "tracking",
  "tracking-by-detection",
  "machine-learning",
  "deep-learning",
  "vision",
  "ML",
  "DL",
  "AI",
  "YOLO",
]

dependencies = [
  # Kalman filters for motion models (SORT/OCSort/HybridSort)
  "filterpy<2.0.0,>=1.4.5",
  # Download pretrained weights/checkpoints from Google Drive
  "gdown<6.0.0,>=5.1.0",
  # Fast LAP/Hungarian solver for data association
  "lapx<1.0.0,>=0.5.5",
  "numpy>=2.2.0",
  "scikit-learn<2.0.0,>=1.3.0",
  "pandas<3.0.0,>=2.0.0",
  "opencv-python<5.0.0,>=4.7.0",
  "torch>=2.2.1,<3.0.0",
  "torchvision>=0.17.1,<1.0.0",
  # MobileNetV4 ImageNet backbones and weights from Hugging Face pytorch-image-models.
  "timm>=1.0.15,<2.0.0",
  "click>=8.1.8",
  # Rich console + logging UI used across the CLI workflows.
  "rich>=15.0.0",
  # Dependency-light progress fallback for resources and postprocessing.
  "tqdm>=4.67.1,<5.0.0",
  # Backport typing.Self for the supported Python 3.10 runtime.
  "typing-extensions>=4.12.2,<5.0.0",
  "huggingface-hub>=1.7.1",
  # Canonical keyed dataset storage and platform-local metadata caches.
  "pyarrow>=18.0.0,<24.0.0",
  "platformdirs>=4.3.0,<5.0.0",
]

[project.scripts]
boxmot = "boxmot.engine.cli:main"
boxmot-service = "boxmot.engine.service.__main__:main"

########################################
# local-only “dev/test/docs/ci” stacks #
########################################

[dependency-groups]
dev  = ["ipykernel>=6.29.5,<7.0.0", "pre-commit>=4.0.1"]
test = ["pytest>=8.0.2,<10.0.0", "pytest-cov>=6.0.0,<7.0.0"]
docs = [
  "mkdocs>=1.6.1,<2.0.0",
  "mkdocs-autorefs>=1.4.4,<2.0.0",
  "mkdocs-click>=0.9.0,<1.0.0",
  # Use the final MkDocs-only releases while this site remains on MkDocs.
  "mkdocs-gen-files>=0.6.0,<0.6.1",
  "mkdocs-include-markdown-plugin>=7.1.6,<8.0.0",
  "mkdocs-literate-nav>=0.6.2,<0.6.3",
  "mkdocs-material>=9.7.7,<10.0.0",
  "mkdocs-section-index>=0.3.10,<0.3.11",
  "mkdocstrings>=1.0.3,<2.0.0", "mkdocstrings-python>=2.0.3,<3.0.0",
  "ruff>=0.12.0,<1.0.0",
]
# Minimal dependencies for the canonical Torch-structure HTTP service image.
# Docker runs BoxMOT from source and installs only this local dependency group.
service-runtime = [
  "fastapi>=0.135.1,<1.0.0",
  "lapx<1.0.0,>=0.5.5",
  "numpy>=2.2.0",
  "opencv-python-headless<5.0.0,>=4.7.0",
  "pydantic>=2.5.0,<2.12.0",
  "pyyaml>=6.0.0,<7.0.0",
  "rich>=15.0.0",
  "scipy>=1.11.0,<2.0.0",
  "torch>=2.2.1,<3.0.0",
  "torchvision>=0.17.1,<1.0.0",
  "uvicorn>=0.44.0,<1.0.0",
]

#############################
# runtime / feature toggles #
#############################

[project.optional-dependencies]
cpu = [
  # Select the CPU wheel source for the project's PyTorch runtime.
  "torch>=2.2.1,<3.0.0",
  "torchvision>=0.17.1,<1.0.0",
]

cu130 = [
  # Select the CUDA 13.0 wheel source for the project's PyTorch runtime.
  "torch>=2.2.1,<3.0.0",
  "torchvision>=0.17.1,<1.0.0",
]

trackeval = ["trackeval==1.3.0"]

# COCO RLE encoding and mask overlap for native MOTS evaluation.
mots = ["pycocotools>=2.0.7,<3.0.0"]

service = [
  "fastapi>=0.135.1,<1.0.0",
  "pydantic>=2.5.0,<2.12.0",
  "uvicorn>=0.44.0,<1.0.0",
]

service-gpu = [
  "filelock>=3.13.1,<4.0.0",
  "packaging>=23.0,<27.0.0",
]

yolo = [
  "ultralytics>=8.4.58",
  "yolox==0.3.0",
  # yolox 0.3.0 imports loguru in its dist utilities but does not declare it
  # in the metadata uv reads, so pull it in explicitly here.
  "loguru>=0.7.2,<1.0.0",
]

evolve = [
  "ray[tune]==2.52.1",
  "matplotlib>=3.8.0,<4.0.0",
  "seaborn>=0.13.0,<1.0.0",
  "scipy>=1.11.0,<2.0.0",
  "plotly==5.19.0",
  "bayesian-optimization==2.0.4",
  "optuna==3.5.0",
  "hyperopt>=0.2.7",
  "pydantic>=2.5.0,<2.12.0"
]

research = [
  "gepa[full]>=0.1.1",
]

onnx = [
  "onnx==1.20.1",
  "onnxruntime==1.24.3",
  "onnxslim>=0.1.67",
  "onnxscript>=0.1.0"
]

coreml = [
  "coremltools==9.0",
  # Guard Core ML conversion/compilation subprocesses by aggregate resident RAM.
  "psutil>=5.9.5,<8.0.0",
]

openvino = ["openvino>=2025.2.0"]

tflite = [
  "ai-edge-litert>=2.1.0",
  "litert-torch==0.9.1",
]

rtdetr = [
  "transformers>=5.0.0",
]
