site_name: "BoxMOT"
site_url: https://mikel-brostrom.github.io/boxmot/
site_description: Pluggable multi-object tracking for detection, segmentation, and pose models.
repo_url: https://github.com/mikel-brostrom/boxmot
repo_name: mikel-brostrom/boxmot
edit_uri: blob/master/docs/
theme:
  name: material
  logo: logo/logo_white.png
  icon:
    repo: fontawesome/brands/github
  palette:
    # Light mode (default), with a switch to dark.
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: white
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    # Dark mode, with a switch back to light.
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.path
    - navigation.prune
    - navigation.top
    - content.action.view
    - content.code.copy
    - content.tabs.link
    - toc.follow

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - mkdocs-click
  - md_in_html
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search:
      separator: '[\s\-\._]+'
  - autorefs:
      resolve_closest: true
  - gen-files:
      scripts:
        - docs/gen_ref_pages.py
  - literate-nav:
      nav_file: SUMMARY.md
  - section-index
  - include-markdown
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths:
            - .
          options:
            allow_inspection: false
            docstring_style: google
            docstring_options:
              ignore_init_summary: true
            docstring_section_style: list
            merge_init_into_class: true
            members_order:
              - "__all__"
              - alphabetical
            separate_signature: true
            show_signature_annotations: true
            show_source: false
            signature_crossrefs: true
            unwrap_annotated: true
            filters:
              - "!^_[^_]"
              - "!^__all__$"

watch:
  - README.md
  - boxmot

exclude_docs: |
  AGENTS.md
  gen_ref_pages.py

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

nav:
  - Home:
      - Overview: index.md
      - Installation: getting-started/installation.md
  - Modes:
      - Overview: modes/index.md
      - Tracking:
          - Track: modes/track.md
      - Benchmarking:
          - Materialize: modes/materialize.md
          - Time-variant dataset: modes/time-variant.md
          - Evaluate: modes/eval.md
          - Tune: modes/tune.md
          - Research: modes/research.md
      - ReID lifecycle:
          - Train: modes/train.md
          - Evaluate: modes/eval-reid.md
          - Compare: modes/compare-reid.md
          - Export: modes/export.md
  - Tasks:
      - Overview: tasks/index.md
      - Bounding Boxes: tasks/aabb.md
      - Oriented Boxes: tasks/obb.md
      - Masks: tasks/masks.md
  - Trackers:
      - Overview: trackers/index.md
      - Motion-only:
          - ByteTrack: trackers/bytetrack.md
          - OcSort: trackers/ocsort.md
          - SFSORT: trackers/sfsort.md
      - Appearance-assisted:
          - BotSort: trackers/botsort.md
          - StrongSort: trackers/strongsort.md
          - DeepOcSort: trackers/deepocsort.md
          - HybridSort: trackers/hybridsort.md
          - BoostTrack: trackers/boosttrack.md
          - OccluBoost: trackers/occluboost.md
      - Mask-aware:
          - Sam2Mot: trackers/sam2mot.md
          - MafHda: trackers/maf_hda.md
      - Sensor fusion:
          - EagerMot: trackers/eagermot.md
  - Compare: compare/index.md
  - Data:
      - Config System Overview: config/index.md
      - Mode Defaults: config/modes.md
      - Experiments: config/experiments.md
      - Dataset Profiles: config/datasets.md
      - Detector Profiles: config/detectors.md
      - ReID Models: config/reid-models.md
      - ReID Runtime Profiles: config/reid.md
      - Tracker YAMLs: config/trackers.md
  - Guides:
      - Overview: guides/index.md
      - Concepts:
          - Canonical Geometry: concepts/index.md
          - Tracking Pipeline: concepts/tracking-pipeline.md
      - Workflows:
          - Migrating to v24: guides/v24-migration.md
          - Experiment Workflows: guides/experiments.md
          - Evaluation and Postprocessing: guides/evaluation.md
      - ReID Research:
          - CSL-TinyViT-7M HP-GRD: guides/csl-tinyvit-7m-hpgrd.md
  - Integrations:
      - Overview: integrations/index.md
      - Tracker Service: guides/deployment.md
      - Native C++: native/index.md
  - Reference:
      - Overview: api/index.md
      - CLI: usage/index.md
      - Python API Guide: python/index.md
      - Public API: python/high-level.md
      - Component API: python/low-level.md
      - Full Source Reference: reference/
  - Help:
      - Help Center: help/index.md
      - Troubleshooting and FAQ: guides/troubleshooting.md
  - Developers:
      - Contributing Guide: contributing/index.md
      - Add a Tracker: contributing/add-tracker.md
      - Add OBB Support: contributing/obb-support.md
      - Add Catalog Entries: contributing/configs.md
      - Documentation: contributing/documentation.md
