# MobileNetV4-Conv-Small transfer of the best CSL-TinyViT-11M a11k procedure.
#
# Shared ReID procedure:
#   - P12 x K8 identity sampler (96 training images per batch)
#   - seven scale-balanced branches: global + 2 stripes + 4 stripes
#   - CE on every branch; triplet and center loss on the combined descriptor
#   - 120 epochs, 10 frozen-backbone epochs, 20 warmup epochs
#
# Architecture adaptation:
#   - C5/timm head -> 384-D global branch
#   - C4 at 24x8   -> two 192-D stripe branches
#   - C3 at 48x16  -> four 96-D stripe branches
#   - 1152-D descriptor; the complete ReID addition remains smaller than the backbone
#   - MobileNet-native AdamW/no-decay groups, regularization, and EMA

run:
  model_name: mobilenetv4_conv_small
  seed: 0
  deterministic: true
  pretrained: true

data:
  dataset: market1501
  data_dir: boxmot/datasets/reid/Market-1501-v15.09.15
  img_size: [384, 128]
  preprocess: resize
  batch_size: 64
  sampler:
    p: 12
    k: 8
  num_workers: 0

model:
  feature_fusion: global_final_parts_stage0_semantic_fine
  pyramid_resize_mode: pool_bilinear
  spatial_conv_mode: depthwise_separable
  post_fusion_mixer:
    mode: none
    reduction: 4
    kernel: [5, 3]
    gamma_init: 0.0
  feat_dim: 384
  neck_dim: 384
  head:
    pool: gelu_gem
    parts: [1, 2, 4]
    head_type: standard
    part_pooling: stripes
    num_part_tokens: 4
    decouple_patterns: false
    pattern_adapter_dim: 128
    stripe_visibility: false
    drop_global_aux: false
    drop_global_aux_ratio: 0.25
    warmup_epochs: 0
    warmup_lr_mult: 2.0
  feature_selection:
    metric_feature: raw_concat
    inference_feature: norm_concat_bn
  branch:
    aware_metric: false
    metric_part_weight: 0.5
    loss_agg: mean
    scale_balanced: true
  regularization:
    drop_path_rate: 0.0

optimization:
  epochs: 120
  optimizer: AdamW
  lr: 0.0005
  weight_decay: 0.0001
  grad_clip: 1.0
  backbone_freeze_epochs: 10
  gradual_unfreeze:
    enabled: false
    head_epochs: 0
    stage_epochs: 0
    backbone_lr_mult: 1.0
    backbone_lr_epochs: 0
  scheduler:
    name: CosineAnnealingLR
    eta_min: 0.0000001
    warmup_epochs: 20
  ema_decay: 0.999

losses:
  loss_type: triplet
  classifier_loss: ce
  weights:
    id_loss_weight: 1.0
    aux_ce_weight: 1.0
    metric_loss_weight: 1.0
    center_loss_weight: 0.0005
  aux_ce_drop_epoch: 0
  label_smooth: 0.1
  triplet:
    margin: 0.3
    soft_margin: true

augmentation:
  color_jitter: false
  gaussian_blur: false
  random_grayscale: 0.0
  random_erasing: 0.35
  random_patch: false
  random_crop_scale: 1.05
  color_augmentation: true

evaluation:
  eval_interval: 10
  eval_datasets: []
  flip_tta: false

system:
  device: mps
