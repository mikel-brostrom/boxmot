# Self-contained Human-Privileged Global Rank Distillation (HP-GRD) recipe.
#
# Starts from the 89.96 mAP / 95.58 R1 csl_tinyvit_7m_v20 result in
# runs/csl_tinyvit_7m_fix/a0_model_fixes_applied as an offline fixed teacher.
# The student keeps the same ImageNet initialization as the V20 control, so the
# comparison does not depend on an unavailable human-pretraining checkpoint.
# Pose, parsing, cached teacher descriptors, the GlobalAP memory, and
# intervention forwards are training-only; the deployed graph and
# norm_concat_bn descriptor remain exactly the 7M V20 graph.
#
# The suppression/HP-GRD launcher builds the cache from the local V20 checkpoint
# when it is absent. Replace losses.hpgrd.cache_dir if it is stored elsewhere.
run:
  model_name: csl_tinyvit_7m_v20
  seed: 0
  deterministic: true
  pretrained: true

data:
  dataset: market1501
  data_dir: boxmot/datasets/reid/Market-1501-v15.09.15
  img_size: [384, 128]
  preprocess: resize
  batch_size: 64
  sampler:
    # More identities exposes 23 in-batch negative IDs instead of 11 while
    # retaining four observations and explicitly preferring camera diversity.
    # Camera IDs diversify sampling only; PID alone defines every pair label,
    # and no camera ID is passed to a loss or the model.
    p: 24
    k: 4
    source_balance: ""
    steps_per_epoch: 0
    camera_aware: true
  num_workers: 4

model:
  feature_fusion: global_final_parts_stage0_semantic_fine
  pyramid_resize_mode: bilinear
  spatial_conv_mode: depthwise_separable
  feat_dim: 384
  neck_dim: 384
  post_fusion_mixer:
    mode: none
    reduction: 4
    kernel: [5, 3]
    gamma_init: 0.0
  attention:
    window_layout: rect
    bias: absolute
    interpolate_pretrained_bias: true
    mask: true
    shift: false
    stage3_global: false
  speed:
    stage3_downsample: false
    stage2_width_merge_after: 0
    stage2_mlp_ratio: 4.0
    stage3_mlp_ratio: 4.0
    stage2_depth: 6
    stage3_depth: 2
    native_branch_widths: false
    fine_map_dim: 0
  hierarchy:
    width_first: false
  identity_registers:
    enabled: false
    count: 4
    dim: 96
    num_heads: 4
    dropout: 0.0
    gate_init: 0.0
    diversity_weight: 0.0
    diversity_margin: 0.1
  reid_adapters:
    stages: []
    reduction: 4
  deployment:
    compact_head: false
  head:
    pool: gelu_gem
    parts: [1, 2, 4]
    head_type: standard
    part_pooling: stripes
    num_part_tokens: 4
    anatomical_auxiliary:
      enabled: true
      token_dim: 96
      multiscale: true
      accessory_query: false
      deployment: false
  feature_selection:
    metric_feature: raw_concat
    inference_feature: norm_concat_bn
  branch:
    aware_metric: false
    metric_part_weight: 0.5
    loss_agg: mean
    scale_balanced: true
  regularization:
    drop_path_rate: 0.1

optimization:
  epochs: 200
  optimizer: AdamW
  lr: 0.0007
  weight_decay: 0.1
  grad_clip: 1.0
  layer_decay: 0.95
  vit_lr_profile: layer_decay
  backbone_freeze_epochs: 10
  gradual_unfreeze:
    enabled: false
    head_epochs: 5
    stage_epochs: 20
    backbone_lr_mult: 0.1
    backbone_lr_epochs: 5
  scheduler:
    eta_min: 0.0000001
    warmup_epochs: 20
  ema_decay: 0.0

losses:
  loss_type: triplet
  classifier_loss: ce
  label_smooth: 0.05
  weights:
    id_loss_weight: 1.0
    aux_ce_weight: 1.0
    metric_loss_weight: 1.0
    center_loss_weight: 0.005
  schedules:
    center_loss_ramp:
      start_epoch: 10
      end_epoch: 30
  triplet:
    margin: 0.3
    soft_margin: true
  global_ap:
    # Every non-self same-identity row is positive and every different-identity
    # row is negative. Top-k mining applies only to the latter.
    weight: 0.15
    temperature: 0.05
    topk: 500
    memory_size: 16384
    momentum: 0.2
    # Zero means no hard TTL; the full stable-index memory remains eligible.
    max_age: 0
    start_epoch: 20
    ramp_end_epoch: 50
    decay_start_epoch: 130
    decay_end_epoch: 170
  hpgrd:
    # Teacher relations are grouped by identity only, independent of camera.
    cache_dir: artifacts/hpgrd/market1501_v20_teacher/privileged_graph.pt
    global_weight: 0.30
    part_weight: 0.15
    background_weight: 0.10
    part_drop_weight: 0.05
    part_drop_probability: 0.25
    # Cap HP-GRD pressure to 30% of the base gradient at the shared feature map.
    gradient_fraction: 0.30
    min_confidence: 0.05

augmentation:
  color_jitter: true
  gaussian_blur: true
  random_grayscale: 0.1
  random_erasing: 0.5
  random_patch: true
  random_crop_scale: 1.05
  color_augmentation: true
  background_mosaic:
    enabled: true
    mask_dir: Market-1501-mosaic-highconf-masks
    probability: 0.30
    start_epoch: 20
    ramp_end_epoch: 50
    min_foreground_ratio: 0.55
    max_foreground_ratio: 0.98
    feather: 1.5
    dilation: 2
  same_id_part_mosaic:
    enabled: false
  pav_mosaic:
    enabled: false
    consistency_weight: 0.0
  anatomical_supervision:
    # Dense masks drive fixed pooling from the shared RGB feature map and
    # semantic dropout. The old learned/self-EMA objectives are intentionally
    # bypassed: cached external teacher graphs provide the target instead.
    enabled: true
    metadata_dir: Market-1501-pav-metadata-clean
    person_mask_dir: Market-1501-mosaic-highconf-person-masks
    min_keypoint_confidence: 0.5
    teacher: learned_pose_concat_ema
    teacher_momentum: 0.999
    distill_weight: 0.0
    attention_weight: 0.0
    foreground_weight: 0.0
    semantic_part_weight: 0.0
    visibility_weight: 0.0
    contrastive_weight: 0.0
    descriptor_distill_weight: 0.0
    branch_distill_weight: 0.0
    pose_teacher_weight: 0.0
    query_distill_weight: 0.0
    query_relational_distill_weight: 0.0
    query_diversity_weight: 0.0
    part_triplet_weight: 0.0
    clean_student_consistency_weight: 0.0
    local_scale_weight: 0.6
    fine_scale_weight: 0.4
    cross_scale_weight: 0.0
    pose_only_reliability: 0.0
    student_start_epoch: 20
    student_ramp_end_epoch: 50
    fine_start_epoch: 20
    fine_ramp_end_epoch: 50
    decay_start_epoch: 130
    decay_end_epoch: 170
    temperature: 0.07

evaluation:
  # Market-1501 query/gallery is the official test split. Evaluate once to
  # avoid repeatedly selecting addons against it.
  eval_interval: 200
  eval_datasets: []
  flip_tta: false

system:
  device: mps

derived:
  n_params: 7165011
  inference_additional_params: 0
