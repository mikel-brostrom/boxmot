id: person-appearance
backend: ollama
model: qwen3.5:9b
host: http://localhost:11434
class_ids: [0]
sample_every: 30
batch_size: 5
request_timeout_s: 120
retries: 2
max_crop_side: 640
jpeg_quality: 90
think: false
display_fields: [upper_body_clothing, leg_clothing, footwear, headwear, carried_items, pose]
prompt: >-
  Describe only visible appearance of the tracked person. Describe upper-body
  clothing, leg clothing, footwear, and headwear in two to four words including
  their main colors. Describe visible carried items briefly. Use Unknown for
  hidden or unclear attributes and None only for clearly visible absence.
  Classify pose from the latest sufficiently visible crop, using temporal
  evidence to distinguish walking and running. Provide confidence from zero
  to one for each field. Do not infer identity or sensitive personal traits.
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  additionalProperties: false
  required:
    - upper_body_clothing
    - upper_body_clothing_confidence
    - leg_clothing
    - leg_clothing_confidence
    - footwear
    - footwear_confidence
    - headwear
    - headwear_confidence
    - carried_items
    - carried_items_confidence
    - pose
    - pose_confidence
  $defs:
    description:
      type: string
      minLength: 1
      maxLength: 80
    confidence:
      type: number
      minimum: 0
      maximum: 1
  properties:
    upper_body_clothing: {$ref: '#/$defs/description'}
    upper_body_clothing_confidence: {$ref: '#/$defs/confidence'}
    leg_clothing: {$ref: '#/$defs/description'}
    leg_clothing_confidence: {$ref: '#/$defs/confidence'}
    footwear: {$ref: '#/$defs/description'}
    footwear_confidence: {$ref: '#/$defs/confidence'}
    headwear: {$ref: '#/$defs/description'}
    headwear_confidence: {$ref: '#/$defs/confidence'}
    carried_items: {$ref: '#/$defs/description'}
    carried_items_confidence: {$ref: '#/$defs/confidence'}
    pose:
      type: string
      enum: [Walking, Running, Standing, Sitting, Lying, Crouching, Other, Unknown]
    pose_confidence: {$ref: '#/$defs/confidence'}
