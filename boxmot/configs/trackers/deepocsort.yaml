det_thresh:
  type: uniform
  range: [0.3, 0.6]

max_age:
  type: qrandint
  range: [10, 61, 10]  # step size of 10, upper bound exclusive

# History capacity; runtime expands it beyond the searchable lost-track lifetime.
max_obs: {}

min_hits:
  type: randint
  range: [1, 6]  # upper bound exclusive

iou_threshold:
  type: uniform
  range: [0.1, 0.4]

delta_t:
  type: randint
  range: [1, 6]  # upper bound exclusive

asso_func:
  type: choice
  options: [iou, giou, diou, ciou, hmiou, centroid]

inertia:
  type: uniform
  range: [0.1, 0.4]

w_association_emb:
  type: uniform
  range: [0.5, 0.9]

alpha_fixed_emb:
  type: uniform
  range: [0.9, 0.999]

aw_param:
  type: uniform
  range: [0.3, 0.7]

use_embeddings:
  type: choice
  options: [True, False]

cmc_off:
  type: choice
  options: [True, False]

aw_off:
  type: choice
  options: [True, False]

# Timing and reference-prior units stay fixed across all tuning trials.

kalman:
  variable_dt:
    default: false

  # Fixed covariance defaults; --calibrate-kf supplies fitted values.
  noise:
    time_unit:
      default: null
    reference_dt_s:
      default: 0.03333333333333333
    process_position_scale:
      default: 1.0
    process_velocity_scale:
      default: 1.0
    measurement_noise_scale:
      default: 1.0
    initial_position_scale:
      default: 1.0
    initial_velocity_scale:
      default: 1.0

# Optional EdgeTAM guidance; searched only with --edgetam.
edgetam:
  min_coverage:
    type: uniform
    default: 0.90
    range: [0.50, 1.0]

  min_fill:
    type: uniform
    default: 0.05
    range: [0.01, 0.25]

  prompt_overlap:
    type: uniform
    default: 0.10
    range: [0.01, 0.50]

  max_objects:
    type: choice
    default: 96
    options: [8, 16, 24, 32, 64, 96]
