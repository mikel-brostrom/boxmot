# Optional first-pass association fusion. Defaults preserve the tracker algorithm.
motion_fusion:
  type: choice
  default: "off"
  options: ["off", gate, blend]

motion_fusion_lambda:
  default: 0.98
  depends_on: motion_fusion
  cases:
    blend:
      type: uniform
      range: [0.0, 1.0]

motion_fusion_only_position:
  default: false
  depends_on: motion_fusion
  cases:
    gate:
      type: choice
      options: [false, true]
    blend:
      type: choice
      options: [false, true]

fuse_detection_score:
  type: choice
  default: false
  options: [false, true]

fuse_iou:
  default: false
  depends_on: use_embeddings
  cases:
    true:
      type: choice
      options: [false, true]

det_thresh:
  type: uniform
  default: 0.5
  range: [0.3, 0.6]

max_age:
  type: qrandint
  default: 30
  range: [10, 61, 10]  # step size of 10, upper bound exclusive

# History capacity; runtime expands it beyond the searchable lost-track lifetime.
max_obs: {}

min_hits:
  type: randint
  default: 3
  range: [1, 6]  # upper bound exclusive

iou_threshold:
  type: uniform
  default: 0.3
  range: [0.1, 0.4]
  association: [iou, giou, diou, ciou, hmiou]

delta_t:
  type: randint
  default: 3
  range: [1, 6]  # upper bound exclusive

asso_func:
  type: choice
  default: iou
  options: [iou, giou, diou, ciou, hmiou, centroid]

# Maximum centroid displacement as a fraction of the frame diagonal.
# Centroid ignores overlap thresholds; optional motion fusion adds its own gate.
centroid_max_distance:
  association: [centroid]
  type: uniform
  default: 0.05
  range: [0.005, 0.1]

inertia:
  type: uniform
  default: 0.2
  range: [0.1, 0.4]

w_association_emb:
  type: uniform
  default: 0.75
  range: [0.5, 0.9]

alpha_fixed_emb:
  type: uniform
  default: 0.95
  range: [0.9, 0.999]

aw_param:
  type: uniform
  default: 0.5
  range: [0.3, 0.7]

use_embeddings:
  type: choice
  default: true
  options: [True, False]

use_cmc:
  type: choice
  default: true
  options: [True, False]

# Keep the estimator and camera mask threshold fixed across tracker trials.
cmc_method: {}
cmc_min_conf: {}

aw_off:
  type: choice
  default: false
  options: [True, False]

# Timing and reference-prior units stay fixed across all tuning trials.

kalman:
  # Search filter types from this tracker's explicit default.
  type:
    type: choice
    default: xysr
    options: [xyah, xywh, xysr, xyhr, xyscr]

  variable_dt:
    default: false

  # Fixed covariance defaults; --calibrate-kf supplies fitted values.
  noise:
    time_unit:
      default: null
    reference_dt_s:
      default: 0.03333333333333333
    process_position_scale:
      default: 1.0
    process_velocity_scale:
      default: 1.0
    measurement_noise_scale:
      default: 1.0
    initial_position_scale:
      default: 1.0
    initial_velocity_scale:
      default: 1.0

# Optional EdgeTAM guidance; searched only with --edgetam.
edgetam:
  min_coverage:
    type: uniform
    default: 0.90
    range: [0.50, 1.0]

  min_fill:
    type: uniform
    default: 0.05
    range: [0.01, 0.25]

  prompt_overlap:
    type: uniform
    default: 0.10
    range: [0.01, 0.50]

  max_objects:
    type: choice
    default: 96
    options: [8, 16, 24, 32, 64, 96]
