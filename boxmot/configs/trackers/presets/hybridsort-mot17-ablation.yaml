# Historical MOT17 baseline, before SportsMOT validation tuning became the defaults.
tracker: hybridsort
det_thresh: 0.3
max_age: 30
max_obs: 50
min_hits: 3
iou_threshold: 0.3
asso_func: iou
cmc_method: ecc
use_embeddings: true
low_thresh: 0.1
delta_t: 3
inertia: 0.05
use_byte: true
longterm_bank_length: 30
alpha: 0.9
adapfs: false
track_thresh: 0.5
eg_weight_high_score: 4.6
eg_weight_low_score: 1.3
tcm_first_step: true
tcm_byte_step: true
tcm_byte_step_weight: 1.0
with_longterm_reid: true
longterm_reid_weight: 0.0
with_longterm_reid_correction: true
longterm_reid_correction_thresh: 0.4
longterm_reid_correction_thresh_low: 0.4
