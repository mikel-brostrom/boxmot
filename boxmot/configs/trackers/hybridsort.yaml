det_thresh:
  type: uniform
  range: [0.1, 0.8]

max_age:
  type: qrandint
  range: [10, 360, 10]

max_obs:
  type: qrandint
  range: [10, 101, 10]

min_hits:
  type: randint
  range: [1, 6]

iou_threshold:
  type: uniform
  range: [0.1, 0.7]
  association: [iou, giou, diou, ciou, hmiou]

asso_func:
  type: choice
  options: [iou, giou, diou, ciou, hmiou, centroid]

# Maximum centroid displacement as a fraction of the frame diagonal.
# The sole geometric cutoff for centroid; other geometric thresholds are inactive.
centroid_max_distance:
  association: [centroid]
  type: uniform
  range: [0.005, 0.1]

cmc_method:
  type: choice
  options: [sof, ecc]

# Keep activation and the camera mask threshold fixed across tracker trials.
use_cmc: {}
cmc_min_conf: {}

delta_t:
  type: randint
  range: [1, 6]

use_byte:
  type: choice
  options: [False, True]
  activates:
    low_thresh:
      type: uniform
      range: [0.05, 0.5]
    tcm_byte_step:
      type: choice
      options: [False, True]
      activates:
        tcm_byte_step_weight:
          type: uniform
          range: [0.5, 2.0]

tcm_first_step:
  type: choice
  options: [False, True]
  activates:
    inertia:
      type: uniform
      range: [0.001, 0.2]

track_thresh:
  type: uniform
  range: [0.3, 0.9]

confidence_floor:
  geometry: aabb
  type: uniform
  range: [0.0, 0.3]

use_embeddings:
  type: choice
  options: [False, True]
  activates:
    longterm_bank_length:
      type: qrandint
      range: [10, 360, 10]
    alpha:
      type: uniform
      range: [0.7, 0.99]
    adapfs:
      type: choice
      options: [False, True]
    eg_weight_high_score:
      type: uniform
      range: [1.5, 8.0]
    eg_weight_low_score:
      type: uniform
      range: [0.5, 3.0]
    with_longterm_reid:
      type: choice
      options: [False, True]
      activates:
        longterm_reid_weight:
          type: uniform
          range: [0.0, 2.0]
    with_longterm_reid_correction:
      type: choice
      options: [False, True]
      activates:
        longterm_reid_correction_thresh:
          association: [iou, giou, diou, ciou, hmiou]
          type: uniform
          range: [0.1, 0.7]
        longterm_reid_correction_thresh_low:
          type: uniform
          range: [0.1, 0.7]

# Timing and reference-prior units stay fixed across all tuning trials.

kalman:
  # Preserve the tracker-specific filter unless a profile or --select-kf chooses one.
  type:
    default: null

  variable_dt:
    default: false

  # Fixed covariance defaults; --calibrate-kf supplies fitted values.
  noise:
    time_unit:
      default: null
    reference_dt_s:
      default: 0.03333333333333333
    process_position_scale:
      default: 1.0
    process_velocity_scale:
      default: 1.0
    measurement_noise_scale:
      default: 1.0
    initial_position_scale:
      default: 1.0
    initial_velocity_scale:
      default: 1.0

# Optional EdgeTAM guidance; searched only with --edgetam.
edgetam:
  min_coverage:
    type: uniform
    default: 0.90
    range: [0.50, 1.0]

  min_fill:
    type: uniform
    default: 0.05
    range: [0.01, 0.25]

  prompt_overlap:
    type: uniform
    default: 0.10
    range: [0.01, 0.50]

  max_objects:
    type: choice
    default: 96
    options: [8, 16, 24, 32, 64, 96]
