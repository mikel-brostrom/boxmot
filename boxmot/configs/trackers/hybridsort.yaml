# Optional first-pass association fusion. Defaults preserve the tracker algorithm.
motion_fusion:
  type: choice
  default: "off"
  options: ["off", gate, blend]

motion_fusion_lambda:
  default: 0.98
  depends_on: motion_fusion
  cases:
    blend:
      type: uniform
      range: [0.0, 1.0]

motion_fusion_only_position:
  default: false
  depends_on: motion_fusion
  cases:
    gate:
      type: choice
      options: [false, true]
    blend:
      type: choice
      options: [false, true]

fuse_detection_score:
  type: choice
  default: false
  options: [false, true]

fuse_iou:
  default: false
  depends_on: use_embeddings
  cases:
    true:
      type: choice
      options: [false, true]

det_thresh:
  type: uniform
  default: 0.38633684113126876
  range: [0.1, 0.8]

max_age:
  type: qrandint
  default: 230
  range: [10, 360, 10]

max_obs:
  type: qrandint
  default: 90
  range: [10, 101, 10]

min_hits:
  type: randint
  default: 1
  range: [1, 6]

iou_threshold:
  type: uniform
  default: 0.24623615333496582
  range: [0.1, 0.7]
  association: [iou, giou, diou, ciou, hmiou]

asso_func:
  type: choice
  default: diou
  options: [iou, giou, diou, ciou, hmiou, centroid]

# Maximum centroid displacement as a fraction of the frame diagonal.
# Centroid ignores overlap thresholds; optional motion fusion adds its own gate.
centroid_max_distance:
  association: [centroid]
  type: uniform
  default: 0.05
  range: [0.005, 0.1]

cmc_method:
  type: choice
  default: ecc
  options: [sof, ecc]

# Keep activation and the camera mask threshold fixed across tracker trials.
use_cmc: {}
cmc_min_conf: {}

delta_t:
  type: randint
  default: 4
  range: [1, 6]

use_byte:
  type: choice
  default: false
  options: [False, True]
  activates:
    low_thresh:
      type: uniform
      default: 0.1
      range: [0.05, 0.5]
    tcm_byte_step:
      type: choice
      default: true
      options: [False, True]
      activates:
        tcm_byte_step_weight:
          type: uniform
          default: 1.0
          range: [0.5, 2.0]

tcm_first_step:
  type: choice
  default: true
  options: [False, True]
  activates:
    inertia:
      type: uniform
      default: 0.07385224556640951
      range: [0.001, 0.2]

track_thresh:
  type: uniform
  default: 0.3190991353484191
  range: [0.3, 0.9]

confidence_floor:
  geometry: aabb
  type: uniform
  default: 0.1
  range: [0.0, 0.3]

use_embeddings:
  type: choice
  default: true
  options: [False, True]
  activates:
    longterm_bank_length:
      type: qrandint
      default: 270
      range: [10, 360, 10]
    alpha:
      type: uniform
      default: 0.9189916764734039
      range: [0.7, 0.99]
    adapfs:
      type: choice
      default: true
      options: [False, True]
    eg_weight_high_score:
      type: uniform
      default: 3.8961609177336562
      range: [1.5, 8.0]
    eg_weight_low_score:
      type: uniform
      default: 0.5096125821683565
      range: [0.5, 3.0]
    with_longterm_reid:
      type: choice
      default: true
      options: [False, True]
      activates:
        longterm_reid_weight:
          type: uniform
          default: 1.9752492019041523
          range: [0.0, 2.0]
    with_longterm_reid_correction:
      type: choice
      default: true
      options: [False, True]
      activates:
        longterm_reid_correction_thresh:
          association: [iou, giou, diou, ciou, hmiou]
          type: uniform
          default: 0.11310432273756706
          range: [0.1, 0.7]
        longterm_reid_correction_thresh_low:
          type: uniform
          default: 0.3479740001301599
          range: [0.1, 0.7]

# Timing and reference-prior units stay fixed across all tuning trials.

kalman:
  # Search filter types from this tracker's explicit default.
  type:
    type: choice
    default: xyscr
    options: [xyah, xywh, xysr, xyhr, xyscr]

  variable_dt:
    default: false

  # Fixed covariance defaults; --calibrate-kf supplies fitted values.
  noise:
    time_unit:
      default: null
    reference_dt_s:
      default: 0.03333333333333333
    process_position_scale:
      default: 1.0
    process_velocity_scale:
      default: 1.0
    measurement_noise_scale:
      default: 1.0
    initial_position_scale:
      default: 1.0
    initial_velocity_scale:
      default: 1.0

# Optional EdgeTAM guidance; searched only with --edgetam.
edgetam:
  min_coverage:
    type: uniform
    default: 0.90
    range: [0.50, 1.0]

  min_fill:
    type: uniform
    default: 0.05
    range: [0.01, 0.25]

  prompt_overlap:
    type: uniform
    default: 0.10
    range: [0.01, 0.50]

  max_objects:
    type: choice
    default: 96
    options: [8, 16, 24, 32, 64, 96]
