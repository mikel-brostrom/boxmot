min_conf:
  type: uniform
  range: [0.1, 0.3]

fuse_first_associate:
  type: choice
  options: [False, True]

fuse_unconfirmed_associate:
  type: choice
  options: [False, True]

# IoU distance cutoff, independent of the selected association metric.
duplicate_distance_thresh:
  type: uniform
  range: [0.0, 0.3]

track_thresh:
  type: uniform
  range: [0.4, 0.7]

# Lost-track lifetime in tracker updates, without FPS scaling.
max_lost_frames:
  type: randint
  range: [1, 200]

match_thresh:
  type: uniform
  range: [0.7, 0.9]
  association: [iou, giou, diou, ciou, hmiou]
  depends_on: asso_func
  cases:
    giou:
      range: [0.4, 0.85]
    diou:
      range: [0.4, 0.85]
    ciou:
      range: [0.4, 0.85]

second_match_thresh:
  type: uniform
  range: [0.1, 0.9]
  association: [iou, giou, diou, ciou, hmiou]
  depends_on: asso_func
  cases:
    giou:
      range: [0.05, 0.45]
    diou:
      range: [0.05, 0.45]
    ciou:
      range: [0.05, 0.45]

unconfirmed_match_thresh:
  type: uniform
  range: [0.4, 0.9]
  association: [iou, giou, diou, ciou, hmiou]
  depends_on: asso_func
  cases:
    giou:
      range: [0.4, 0.85]
    diou:
      range: [0.4, 0.85]
    ciou:
      range: [0.4, 0.85]

asso_func:
  type: choice
  options: [iou, giou, diou, ciou, hmiou, centroid]

# Maximum centroid displacement as a fraction of the frame diagonal.
# The sole geometric cutoff for centroid; other geometric thresholds are inactive.
centroid_max_distance:
  association: [centroid]
  type: uniform
  range: [0.005, 0.1]

# Camera settings stay fixed unless supplied by CMC selection.
use_cmc: {}
cmc_method: {}
cmc_min_conf: {}

# Timing and reference-prior units stay fixed across all tuning trials.

kalman:
  # Preserve the tracker-specific filter unless a profile or --select-kf chooses one.
  type:
    default: null

  variable_dt:
    default: false

  # Fixed covariance defaults; --calibrate-kf supplies fitted values.
  noise:
    time_unit:
      default: null
    reference_dt_s:
      default: 0.03333333333333333
    process_position_scale:
      default: 1.0
    process_velocity_scale:
      default: 1.0
    measurement_noise_scale:
      default: 1.0
    initial_position_scale:
      default: 1.0
    initial_velocity_scale:
      default: 1.0

# Optional EdgeTAM guidance; searched only with --edgetam.
edgetam:
  min_coverage:
    type: uniform
    default: 0.90
    range: [0.50, 1.0]

  min_fill:
    type: uniform
    default: 0.05
    range: [0.01, 0.25]

  prompt_overlap:
    type: uniform
    default: 0.10
    range: [0.01, 0.50]

  max_objects:
    type: choice
    default: 96
    options: [8, 16, 24, 32, 64, 96]
