max_age:
  type: randint
  default: 60
  range: [15, 90]

min_hits:
  type: randint
  default: 3
  range: [1, 5]

det_thresh:
  type: uniform
  default: 0.6
  range: [0.1, 0.9]

iou_threshold:
  type: uniform
  default: 0.3
  range: [0.1, 0.9]

asso_func:
  type: choice
  default: iou
  options: [iou, giou, diou, ciou, hmiou, centroid]

use_cmc:
  type: choice
  default: True
  options: [False, True]
  activates:
    cmc_method:
      type: choice
      default: ecc
      options: [sof, ecc]

min_box_area:
  type: randint
  default: 10
  range: [5, 100]

aspect_ratio_thresh:
  type: uniform
  default: 1.6
  range: [0.1, 2.0]

lambda_iou:
  type: uniform
  default: 0.5
  range: [0.3, 2.0]

lambda_mhd:
  type: uniform
  default: 0.25
  range: [0.5, 2.0]

lambda_shape:
  type: uniform
  default: 0.25
  range: [0.5, 2.0]

use_dlo_boost:
  type: choice
  default: True
  options: [False, True]

use_duo_boost:
  type: choice
  default: True
  options: [False, True]

dlo_boost_coef:
  type: uniform
  default: 0.65
  range: [0.3, 2.0]

s_sim_corr:
  type: choice
  default: False
  options: [False, True]

use_rich_s:
  type: choice
  default: True # True for BoostTrack++
  options: [False, True]

use_sb:
  type: choice
  default: True # True for BoostTrack++
  options: [False, True]

use_vt:
  type: choice
  default: True # True for BoostTrack++
  options: [False, True]

use_embeddings:
  type: choice
  default: True # True for BoostTrack+ and BoostTrack++
  options: [False, True]

adaptive_kf:
  type: choice
  default: False
  options: [False, True]

# Timing and reference-prior units stay fixed across all tuning trials.
variable_dt:
  default: false
kf_time_unit:
  default: null
kf_reference_dt_s:
  default: 0.03333333333333333

# Dimensionless covariance multipliers shared by KF-only and joint tuning.
kf_process_position_scale:
  type: loguniform
  default: 1.0
  range: [0.01, 100.0]
kf_process_velocity_scale:
  type: loguniform
  default: 1.0
  range: [0.01, 100.0]
kf_measurement_noise_scale:
  type: loguniform
  default: 1.0
  range: [0.01, 100.0]
kf_initial_position_scale:
  type: loguniform
  default: 1.0
  range: [0.01, 100.0]
kf_initial_velocity_scale:
  type: loguniform
  default: 1.0
  range: [0.01, 100.0]
