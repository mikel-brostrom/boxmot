max_age:
  type: randint
  default: 60
  range: [15, 90]

min_hits:
  type: randint
  default: 3
  range: [1, 5]

det_thresh:
  type: uniform
  default: 0.6
  range: [0.1, 0.9]

iou_threshold:
  type: uniform
  default: 0.3
  range: [0.1, 0.9]
  association: [iou, giou, diou, ciou, hmiou]

asso_func:
  type: choice
  default: iou
  options: [iou, giou, diou, ciou, hmiou, centroid]

# Maximum centroid displacement as a fraction of the frame diagonal.
# The sole geometric cutoff for centroid; other geometric thresholds are inactive.
centroid_max_distance:
  association: [centroid]
  type: uniform
  default: 0.05
  range: [0.005, 0.1]

use_cmc:
  type: choice
  default: true
  options: [False, True]
  activates:
    cmc_method:
      type: choice
      default: ecc
      options: [sof, ecc]

# Keep the camera mask threshold fixed across tracker trials.
cmc_min_conf: {}

min_box_area:
  type: randint
  default: 10
  range: [5, 100]

aspect_ratio_thresh:
  type: uniform
  default: 1.6
  range: [0.1, 2.0]

lambda_iou:
  type: uniform
  default: 0.5
  range: [0.3, 2.0]

lambda_mhd:
  type: uniform
  default: 0.25
  range: [0.5, 2.0]

lambda_shape:
  type: uniform
  default: 0.25
  range: [0.5, 2.0]

# Confidence assigned to young tracks and tracks missing recent detections.
track_confidence_decay:
  type: uniform
  default: 0.9
  range: [0.7, 0.99]

track_confidence_warmup:
  type: randint
  default: 7
  range: [1, 15]

use_dlo_boost:
  type: choice
  default: true
  options: [False, True]
  activates:
    dlo_boost_coef:
      type: uniform
      default: 0.65
      range: [0.3, 2.0]
    use_rich_s:
      type: choice
      default: true
      options: [False, True]
    use_sb:
      type: choice
      default: true
      options: [False, True]
      activates:
        dlo_soft_alpha:
          type: uniform
          default: 0.65
          range: [0.3, 0.9]
        dlo_soft_power:
          type: uniform
          default: 1.5
          range: [0.5, 3.0]
    use_vt:
      type: choice
      default: true
      options: [False, True]
      activates:
        dlo_threshold_start:
          type: uniform
          default: 0.95
          range: [0.8, 1.0]
        dlo_threshold_end:
          type: uniform
          default: 0.8
          range: [0.5, 0.8]

use_duo_boost:
  type: choice
  default: true
  options: [False, True]
  activates:
    duo_mahalanobis_thresh:
      type: uniform
      default: 13.2767
      range: [5.0, 25.0]
    duo_iou_thresh:
      type: uniform
      default: 0.3
      range: [0.1, 0.7]

s_sim_corr:
  type: choice
  default: false
  options: [False, True]

use_embeddings:
  type: choice
  default: true
  options: [False, True]
  activates:
    lambda_emb_multiplier:
      type: uniform
      default: 1.5
      range: [0.1, 8.0]
    alpha_fixed_emb:
      type: uniform
      default: 0.95
      range: [0.7, 1.0]
    appearance_thresh:
      association: [iou, giou, diou, ciou, hmiou]
      type: uniform
      default: 0.75
      range: [0.5, 0.95]
    appearance_iou_fraction:
      association: [iou, giou, diou, ciou, hmiou]
      type: uniform
      default: 0.5
      range: [0.1, 1.0]

# Fixed KF mode; select it before calibration.

kalman:
  # Search filter types from this tracker's explicit default.
  type:
    type: choice
    default: xyhr
    options: [xyah, xywh, xysr, xyhr, xyscr]

  adaptive_kf:
    default: False

  # Timing and reference-prior units stay fixed across all tuning trials.
  variable_dt:
    default: false

  # Fixed covariance defaults; --calibrate-kf supplies fitted values.
  noise:
    time_unit:
      default: null
    reference_dt_s:
      default: 0.03333333333333333
    process_position_scale:
      default: 1.0
    process_velocity_scale:
      default: 1.0
    measurement_noise_scale:
      default: 1.0
    initial_position_scale:
      default: 1.0
    initial_velocity_scale:
      default: 1.0

# Optional EdgeTAM guidance; searched only with --edgetam.
edgetam:
  min_coverage:
    type: uniform
    default: 0.90
    range: [0.50, 1.0]

  min_fill:
    type: uniform
    default: 0.05
    range: [0.01, 0.25]

  prompt_overlap:
    type: uniform
    default: 0.10
    range: [0.01, 0.50]

  max_objects:
    type: choice
    default: 96
    options: [8, 16, 24, 32, 64, 96]
