min_conf:
  type: uniform
  default: 0.6
  range: [0.2, 0.8]

ema_alpha:
  type: uniform
  default: 0.9
  range: [0.7, 0.95]

max_cos_dist:
  type: uniform
  default: 0.4
  range: [0.1, 0.4]

max_iou_dist:
  type: uniform
  default: 0.7
  range: [0.5, 0.95]
  association: [iou, giou, diou, ciou, hmiou]

asso_func:
  type: choice
  default: iou
  options: [iou, giou, diou, ciou, hmiou, centroid]

# Maximum centroid displacement as a fraction of the frame diagonal.
# Centroid ignores overlap thresholds; optional motion fusion adds its own gate.
centroid_max_distance:
  association: [centroid]
  type: uniform
  default: 0.05
  range: [0.005, 0.1]

max_age:
  type: randint
  default: 30
  range: [10, 151]  # upper bound exclusive

n_init:
  type: randint
  default: 3
  range: [1, 4]  # upper bound exclusive

mc_lambda:
  type: uniform
  default: 0.98
  range: [0.90, 0.999]
  depends_on: motion_fusion
  cases:
    "off": {default: 0.98}
    gate: {default: 0.98}

# Preserve StrongSORT's existing gated motion blend by default.
motion_fusion:
  type: choice
  default: blend
  options: ["off", gate, blend]

fuse_iou:
  type: choice
  default: false
  options: [false, true]

fuse_detection_score:
  type: choice
  default: false
  options: [false, true]

gating_only_position:
  type: choice
  default: false
  options: [false, true]
  depends_on: motion_fusion
  cases:
    "off": {default: false}

geometric_recovery_max_age:
  type: randint
  default: 1
  range: [1, 6]

nn_budget:
  type: choice
  default: 100
  # Bound the per-track appearance gallery while varying its memory horizon.
  options: [25, 50, 100, 200]

# Camera settings stay fixed unless supplied by CMC selection.
use_cmc: {}
cmc_method: {}
cmc_min_conf: {}

# Timing and reference-prior units stay fixed across all tuning trials.

kalman:
  # Search filter types from this tracker's explicit default.
  type:
    type: choice
    default: xyah
    options: [xyah, xywh, xysr, xyhr, xyscr]

  variable_dt:
    default: false

  # Fixed covariance defaults; --calibrate-kf supplies fitted values.
  noise:
    time_unit:
      default: null
    reference_dt_s:
      default: 0.03333333333333333
    process_position_scale:
      default: 1.0
    process_velocity_scale:
      default: 1.0
    measurement_noise_scale:
      default: 1.0
    initial_position_scale:
      default: 1.0
    initial_velocity_scale:
      default: 1.0

# Optional EdgeTAM guidance; searched only with --edgetam.
edgetam:
  min_coverage:
    type: uniform
    default: 0.90
    range: [0.50, 1.0]

  min_fill:
    type: uniform
    default: 0.05
    range: [0.01, 0.25]

  prompt_overlap:
    type: uniform
    default: 0.10
    range: [0.01, 0.50]

  max_objects:
    type: choice
    default: 96
    options: [8, 16, 24, 32, 64, 96]
