min_conf:
  type: uniform
  range: [0.2, 0.8]

# StrongSORT filters with min_conf; the inherited threshold is unused.
det_thresh: {}

# Confirmation uses n_init; min_hits only filters shared display output.
min_hits: {}

# Observation history is for display, not matching or gallery retention.
max_obs: {}

# Fallback association uses max_iou_dist, not the inherited IoU threshold.
iou_threshold: {}

ema_alpha:
  type: uniform
  range: [0.7, 0.95]

max_cos_dist:
  type: uniform
  range: [0.1, 0.4]

max_iou_dist:
  type: uniform
  range: [0.5, 0.95]

asso_func:
  type: choice
  options: [iou, giou, diou, ciou, hmiou, centroid]

max_age:
  type: randint
  range: [10, 151]  # upper bound exclusive

n_init:
  type: randint
  range: [1, 4]  # upper bound exclusive

mc_lambda:
  type: uniform
  range: [0.90, 0.999]

nn_budget:
  type: choice
  # Bound the per-track appearance gallery while varying its memory horizon.
  options: [25, 50, 100, 200]

# Timing and reference-prior units stay fixed across all tuning trials.

kalman:
  variable_dt:
    default: false

  # Fixed covariance defaults; --calibrate-kf supplies fitted values.
  noise:
    time_unit:
      default: null
    reference_dt_s:
      default: 0.03333333333333333
    process_position_scale:
      default: 1.0
    process_velocity_scale:
      default: 1.0
    measurement_noise_scale:
      default: 1.0
    initial_position_scale:
      default: 1.0
    initial_velocity_scale:
      default: 1.0

# Optional EdgeTAM guidance; searched only with --edgetam.
edgetam:
  min_coverage:
    type: uniform
    default: 0.90
    range: [0.50, 1.0]

  min_fill:
    type: uniform
    default: 0.05
    range: [0.01, 0.25]

  prompt_overlap:
    type: uniform
    default: 0.10
    range: [0.01, 0.50]

  max_objects:
    type: choice
    default: 96
    options: [8, 16, 24, 32, 64, 96]
