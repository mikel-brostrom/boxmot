min_conf:
  type: uniform
  default: 0.6  # from the default parameters
  range: [0.2, 0.8]

ema_alpha:
  type: uniform
  default: 0.9  # from the default parameters
  range: [0.7, 0.95]

max_cos_dist:
  type: uniform
  default: 0.4  # from the default parameters
  range: [0.1, 0.4]

max_iou_dist:
  type: uniform
  default: 0.7  # from the default parameters
  range: [0.5, 0.95]

asso_func:
  type: choice
  default: iou
  options: [iou, giou, diou, ciou, hmiou, centroid]

max_age:
  type: randint
  default: 30  # from the default parameters
  range: [10, 151]  # upper bound exclusive

n_init:
  type: randint
  default: 3  # from the default parameters
  range: [1, 4]  # upper bound exclusive

mc_lambda:
  type: uniform
  default: 0.98  # from the default parameters
  range: [0.90, 0.999]

nn_budget:
  type: choice
  default: 100  # from the default parameters
  options: [100]

# Timing and reference-prior units stay fixed across all tuning trials.
variable_dt:
  default: false
kf_time_unit:
  default: null
kf_reference_dt_s:
  default: 0.03333333333333333

# Dimensionless covariance multipliers shared by KF-only and joint tuning.
kf_process_position_scale:
  type: loguniform
  default: 1.0
  range: [0.01, 100.0]
kf_process_velocity_scale:
  type: loguniform
  default: 1.0
  range: [0.01, 100.0]
kf_measurement_noise_scale:
  type: loguniform
  default: 1.0
  range: [0.01, 100.0]
kf_initial_position_scale:
  type: loguniform
  default: 1.0
  range: [0.01, 100.0]
kf_initial_velocity_scale:
  type: loguniform
  default: 1.0
  range: [0.01, 100.0]
