# MOTS20 training defaults from the upstream GMPHD_MAF implementation.
det_thresh:
  type: uniform
  range: [0.3, 0.9]

max_age:
  type: randint
  range: [10, 61]

min_hits:
  type: randint
  range: [1, 5]

iou_threshold:
  type: uniform
  range: [0.0, 0.4]
  association: [iou, giou, diou, ciou, hmiou]

asso_func:
  type: choice
  options: [iou, giou, diou, ciou, hmiou, centroid]

# Maximum centroid displacement as a fraction of the frame diagonal.
# The sole geometric cutoff for centroid; other geometric thresholds are inactive.
centroid_max_distance:
  association: [centroid]
  type: uniform
  range: [0.005, 0.1]

velocity_alpha:
  type: uniform
  range: [0.1, 0.9]

merge_iou_thresh:
  type: uniform
  range: [0.2, 0.8]

appearance_lower:
  type: uniform
  range: [0.0, 0.3]

appearance_upper:
  association: [iou, giou, diou, ciou, hmiou]
  type: uniform
  range: [0.5, 0.9]

appearance_gate:
  association: [iou, giou, diou, ciou, hmiou]
  type: choice
  options: [false, true]

s2ta_mode:
  type: choice
  options: [motion, appearance, maf]

t2ta_mode:
  type: choice
  options: [motion, appearance, maf]

template_size:
  type: choice
  options: [64, 96, 128]

kcf_padding:
  type: uniform
  range: [1.0, 4.0]

kcf_sigma:
  type: uniform
  range: [0.1, 1.0]

kcf_regularization:
  type: loguniform
  range: [0.00001, 0.01]

kcf_output_sigma_factor:
  type: uniform
  range: [0.05, 0.3]

kcf_update_mode:
  type: choice
  options: [reinitialize, interpolate]

kcf_interp_factor:
  depends_on: kcf_update_mode
  cases:
    interpolate:
      type: loguniform
      range: [0.001, 0.5]

max_area_ratio:
  association: [iou, giou, diou, ciou, hmiou]
  type: uniform
  range: [1.1, 4.0]

min_intersection_ratio:
  association: [iou, giou, diou, ciou, hmiou]
  type: uniform
  range: [0.1, 0.9]

recovery_overlap_thresh:
  association: [iou, giou, diou, ciou, hmiou]
  type: uniform
  range: [0.5, 1.0]
