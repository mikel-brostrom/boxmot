# MOTS20 training defaults from the upstream GMPHD_MAF implementation.
det_thresh:
  type: uniform
  range: [0.3, 0.9]

max_age:
  type: randint
  range: [10, 61]

# History is retained for display; recovery uses the tracklet endpoints.
max_obs: {}

min_hits:
  type: randint
  range: [1, 5]

iou_threshold:
  type: uniform
  range: [0.0, 0.4]

asso_func:
  type: choice
  options: [iou, giou, diou, ciou, hmiou, centroid]

velocity_alpha:
  type: uniform
  range: [0.1, 0.9]

merge_iou_thresh:
  type: uniform
  range: [0.2, 0.8]

appearance_lower:
  type: uniform
  range: [0.0, 0.3]

appearance_upper:
  type: uniform
  range: [0.5, 0.9]

appearance_gate:
  type: choice
  options: [false, true]

s2ta_mode:
  type: choice
  options: [motion, appearance, maf]

t2ta_mode:
  type: choice
  options: [motion, appearance, maf]

template_size:
  type: choice
  options: [64, 96, 128]
