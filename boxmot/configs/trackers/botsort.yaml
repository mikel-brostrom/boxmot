track_high_thresh:
  type: uniform
  range: [0.3, 0.7]

track_low_thresh:
  type: uniform
  range: [0.1, 0.3]

new_track_thresh:
  type: uniform
  range: [0.1, 0.8]

# Lost-track lifetime in tracker updates, without FPS scaling.
max_lost_frames:
  type: randint
  range: [1, 200]

match_thresh:
  type: uniform
  range: [0.1, 0.9]
  association: [iou, giou, diou, ciou, hmiou]

asso_func:
  type: choice
  options: [iou, giou, diou, ciou, hmiou, centroid]

# Maximum centroid displacement as a fraction of the frame diagonal.
# The sole geometric cutoff for centroid; other geometric thresholds are inactive.
centroid_max_distance:
  association: [centroid]
  type: uniform
  range: [0.005, 0.1]

use_cmc:
  type: choice
  options: [False, True]
  activates:
    cmc_method:
      type: choice
      options: [sof, ecc]

# Keep the camera mask threshold fixed across tracker trials.
cmc_min_conf: {}

fuse_first_associate:
  type: choice
  options: [False, True]

fuse_unconfirmed_associate:
  type: choice
  options: [False, True]

# IoU distance cutoff, independent of the selected association metric.
duplicate_distance_thresh:
  type: uniform
  range: [0.0, 0.3]

use_embeddings:
  type: choice
  options: [False, True]
  activates:
    alpha_fixed_emb:
      type: uniform
      range: [0.7, 0.99]
    proximity_thresh:
      type: uniform
      range: [0.25, 0.75]
      association: [iou, giou, diou, ciou, hmiou]
    appearance_thresh:
      type: uniform
      range: [0.1, 0.8]
    unconfirmed_emb_scale:
      type: uniform
      range: [1.0, 4.0]

second_match_thresh:
  type: uniform
  range: [0.1, 0.9]
  association: [iou, giou, diou, ciou, hmiou]

unconfirmed_match_thresh:
  type: uniform
  range: [0.1, 0.9]
  association: [iou, giou, diou, ciou, hmiou]

removed_stracks_buffer:
  type: randint
  range: [50, 501]

# Timing and reference-prior units stay fixed across all tuning trials.

kalman:
  # Preserve the tracker-specific filter unless a profile or --select-kf chooses one.
  type:
    default: null

  variable_dt:
    default: false

  # Fixed covariance defaults; --calibrate-kf supplies fitted values.
  noise:
    time_unit:
      default: null
    reference_dt_s:
      default: 0.03333333333333333
    process_position_scale:
      default: 1.0
    process_velocity_scale:
      default: 1.0
    measurement_noise_scale:
      default: 1.0
    initial_position_scale:
      default: 1.0
    initial_velocity_scale:
      default: 1.0

# Optional EdgeTAM guidance; searched only with --edgetam.
edgetam:
  min_coverage:
    type: uniform
    default: 0.90
    range: [0.50, 1.0]

  min_fill:
    type: uniform
    default: 0.05
    range: [0.01, 0.25]

  prompt_overlap:
    type: uniform
    default: 0.10
    range: [0.01, 0.50]

  max_objects:
    type: choice
    default: 96
    options: [8, 16, 24, 32, 64, 96]
