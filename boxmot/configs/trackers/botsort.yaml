track_high_thresh:
  type: uniform
  default: 0.6296854875023994
  range: [0.3, 0.7]

track_low_thresh:
  type: uniform
  default: 0.1014392537025336
  range: [0.1, 0.3]

new_track_thresh:
  type: uniform
  default: 0.6246494191492591
  range: [0.1, 0.8]

# Lost-track lifetime in tracker updates, without FPS scaling.
max_lost_frames:
  type: randint
  default: 40
  range: [1, 200]

match_thresh:
  type: uniform
  default: 0.7722224024589055
  range: [0.1, 0.9]
  association: [iou, giou, diou, ciou, hmiou]

asso_func:
  type: choice
  default: iou
  options: [iou, giou, diou, ciou, hmiou, centroid]

# Maximum centroid displacement as a fraction of the frame diagonal.
# Centroid ignores overlap thresholds; optional motion fusion adds its own gate.
centroid_max_distance:
  association: [centroid]
  type: uniform
  default: 0.05
  range: [0.005, 0.1]

use_cmc:
  type: choice
  default: true
  options: [False, True]
  activates:
    cmc_method:
      type: choice
      default: sof
      options: [sof, ecc]

# Keep the camera mask threshold fixed across tracker trials.
cmc_min_conf: {}

fuse_first_associate:
  type: choice
  default: true
  options: [False, True]

fuse_unconfirmed_associate:
  type: choice
  default: true
  options: [False, True]

# Additional motion cues apply only to the predicted high-confidence pool.
motion_fusion:
  type: choice
  default: "off"
  options: ["off", gate, blend]

motion_fusion_lambda:
  type: uniform
  default: 0.98
  range: [0.0, 1.0]
  depends_on: motion_fusion
  cases:
    "off": {default: 0.98}
    gate: {default: 0.98}

motion_fusion_only_position:
  type: choice
  default: false
  options: [false, true]
  depends_on: motion_fusion
  cases:
    "off": {default: false}

# IoU distance cutoff, independent of the selected association metric.
duplicate_distance_thresh:
  type: uniform
  default: 0.15
  range: [0.0, 0.3]

fuse_iou:
  type: choice
  default: false
  options: [false, true]
  depends_on: use_embeddings
  cases:
    false: {default: false}

use_embeddings:
  type: choice
  default: true
  options: [False, True]
  activates:
    alpha_fixed_emb:
      type: uniform
      default: 0.9
      range: [0.7, 0.99]
    proximity_thresh:
      type: uniform
      default: 0.6084297894561342
      range: [0.25, 0.75]
      association: [iou, giou, diou, ciou, hmiou]
    appearance_thresh:
      type: uniform
      default: 0.6188818853936099
      range: [0.1, 0.8]
    unconfirmed_emb_scale:
      type: uniform
      default: 2.5445206391993294
      range: [1.0, 4.0]

second_match_thresh:
  type: uniform
  default: 0.28795081514328974
  range: [0.1, 0.9]
  association: [iou, giou, diou, ciou, hmiou]

unconfirmed_match_thresh:
  type: uniform
  default: 0.41148010638233784
  range: [0.1, 0.9]
  association: [iou, giou, diou, ciou, hmiou]

removed_stracks_buffer:
  type: randint
  default: 329
  range: [50, 501]

# Timing and reference-prior units stay fixed across all tuning trials.

kalman:
  # Search filter types from this tracker's explicit default.
  type:
    type: choice
    default: xywh
    options: [xyah, xywh, xysr, xyhr, xyscr]

  variable_dt:
    default: false

  # Fixed covariance defaults; --calibrate-kf supplies fitted values.
  noise:
    time_unit:
      default: null
    reference_dt_s:
      default: 0.03333333333333333
    process_position_scale:
      default: 1.0
    process_velocity_scale:
      default: 1.0
    measurement_noise_scale:
      default: 1.0
    initial_position_scale:
      default: 1.0
    initial_velocity_scale:
      default: 1.0

# Optional EdgeTAM guidance; searched only with --edgetam.
edgetam:
  min_coverage:
    type: uniform
    default: 0.90
    range: [0.50, 1.0]

  min_fill:
    type: uniform
    default: 0.05
    range: [0.01, 0.25]

  prompt_overlap:
    type: uniform
    default: 0.10
    range: [0.01, 0.50]

  max_objects:
    type: choice
    default: 96
    options: [8, 16, 24, 32, 64, 96]
