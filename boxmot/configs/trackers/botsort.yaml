# Shared history/display controls; track_buffer owns lost-track lifetime.
max_age: {}
max_obs: {}
min_hits: {}

# Confidence stages and match thresholds below own filtering and association.
det_thresh: {}
iou_threshold: {}

track_high_thresh:
  type: uniform
  range: [0.3, 0.7]

track_low_thresh:
  type: uniform
  range: [0.1, 0.3]

new_track_thresh:
  type: uniform
  range: [0.1, 0.8]

track_buffer:
  type: randint
  range: [20, 81]

match_thresh:
  type: uniform
  range: [0.1, 0.9]

asso_func:
  type: choice
  options: [iou, giou, diou, ciou, hmiou, centroid]

use_cmc:
  type: choice
  options: [False, True]
  activates:
    cmc_method:
      type: choice
      options: [sof, ecc]

frame_rate:
  type: choice
  options: [25, 30]

fuse_first_associate:
  type: choice
  options: [False, True]

use_embeddings:
  type: choice
  options: [False, True]
  activates:
    proximity_thresh:
      type: uniform
      range: [0.25, 0.75]
    appearance_thresh:
      type: uniform
      range: [0.1, 0.8]
    unconfirmed_emb_scale:
      type: uniform
      range: [1.0, 4.0]

second_match_thresh:
  type: uniform
  range: [0.1, 0.9]

unconfirmed_match_thresh:
  type: uniform
  range: [0.1, 0.9]

removed_stracks_buffer:
  type: randint
  range: [50, 501]

# Timing and reference-prior units stay fixed across all tuning trials.

kalman:
  variable_dt:
    default: false

  # Fixed covariance defaults; --calibrate-kf supplies fitted values.
  noise:
    time_unit:
      default: null
    reference_dt_s:
      default: 0.03333333333333333
    process_position_scale:
      default: 1.0
    process_velocity_scale:
      default: 1.0
    measurement_noise_scale:
      default: 1.0
    initial_position_scale:
      default: 1.0
    initial_velocity_scale:
      default: 1.0

# Optional EdgeTAM guidance; searched only with --edgetam.
edgetam:
  min_coverage:
    type: uniform
    default: 0.90
    range: [0.50, 1.0]

  min_fill:
    type: uniform
    default: 0.05
    range: [0.01, 0.25]

  prompt_overlap:
    type: uniform
    default: 0.10
    range: [0.01, 0.50]

  max_objects:
    type: choice
    default: 96
    options: [8, 16, 24, 32, 64, 96]
