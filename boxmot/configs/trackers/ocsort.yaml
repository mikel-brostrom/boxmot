min_conf:
  type: uniform
  default: 0.1
  range: [0.1, 0.3]

det_thresh:
  type: uniform
  default: 0.6
  range: [0, 0.6]

max_age:
  type: grid_search
  default: 30
  values: [10, 20, 30, 40, 50, 60]

# Observation/recovery history capacity; runtime expands it to cover max_age.
max_obs: {}

min_hits:
  type: grid_search
  default: 3
  values: [1, 2, 3, 4, 5]

iou_threshold:
  type: uniform
  default: 0.3
  range: [0.1, 0.7]
  association: [iou, giou, diou, ciou, hmiou]

delta_t:
  type: grid_search
  default: 3
  values: [1, 2, 3, 4, 5]

asso_func:
  type: choice
  default: iou
  options: [iou, giou, diou, ciou, hmiou, centroid]

# Maximum centroid displacement as a fraction of the frame diagonal.
# The sole geometric cutoff for centroid; other geometric thresholds are inactive.
centroid_max_distance:
  association: [centroid]
  type: uniform
  default: 0.05
  range: [0.005, 0.1]

use_byte:
  type: choice
  default: false
  options: [True, False]

inertia:
  type: uniform
  default: 0.1
  range: [0.1, 0.4]

# Camera settings stay fixed unless supplied by CMC selection.
use_cmc: {}
cmc_method: {}
cmc_min_conf: {}

# Timing and reference-prior units stay fixed across all tuning trials.

kalman:
  # Search filter types from this tracker's explicit default.
  type:
    type: choice
    default: xysr
    options: [xyah, xywh, xysr, xyhr, xyscr]

  variable_dt:
    default: false

  # Fixed covariance defaults; --calibrate-kf supplies fitted values.
  noise:
    time_unit:
      default: null
    reference_dt_s:
      default: 0.03333333333333333
    process_position_scale:
      default: 1.0
    process_velocity_scale:
      default: 1.0
    measurement_noise_scale:
      default: 1.0
    initial_position_scale:
      default: 1.0
    initial_velocity_scale:
      default: 1.0

# Optional EdgeTAM guidance; searched only with --edgetam.
edgetam:
  min_coverage:
    type: uniform
    default: 0.90
    range: [0.50, 1.0]

  min_fill:
    type: uniform
    default: 0.05
    range: [0.01, 0.25]

  prompt_overlap:
    type: uniform
    default: 0.10
    range: [0.01, 0.50]

  max_objects:
    type: choice
    default: 96
    options: [8, 16, 24, 32, 64, 96]
