# Single-node development profile. Pass --set-string image="$CAMERA_IMAGE".
# Release name "boxmot", namespace "boxmot-helm":
# Secret attributes-database needs url and password, with matching credentials.
# url must address boxmot-postgres:5432/boxmot; Secret camera-01 needs url.
postgres:
  enabled: true
  persistence:
    size: 1Gi
    accessModes: [ReadWriteOnce]
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: 500m, memory: 256Mi}

cameraDefaults:
  resources:
    requests: {cpu: "1", memory: 768Mi}
    limits: {cpu: "2", memory: 1Gi}
  models:
    size: 1Gi
    accessModes: [ReadWriteOnce]
  outputs:
    size: 1Gi
    accessModes: [ReadWriteOnce]

vllm:
  resources:
    requests: {cpu: "2", memory: 4Gi}
    limits: {cpu: "4", memory: 8Gi}
  persistence:
    size: 3Gi
    accessModes: [ReadWriteOnce]

maintenance:
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {cpu: 250m, memory: 128Mi}

cameras:
  camera-01:
    sourceSecret: {name: camera-01, key: url}
