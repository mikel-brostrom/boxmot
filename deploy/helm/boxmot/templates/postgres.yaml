{{- if .Values.postgres.enabled }}
{{- $settings := .Values.postgres }}
{{- $name := printf "%s-postgres" (include "boxmot.fullname" .) }}
{{- $ctx := dict "root" . "settings" $settings "name" $name "component" "postgres" }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "boxmot.labels" $ctx | nindent 4 }}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels:
      {{- include "boxmot.selectorLabels" $ctx | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "boxmot.selectorLabels" $ctx | nindent 8 }}
        {{- with $settings.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        boxmot.io/secret-revision: {{ .Values.secretRevision | quote }}
        {{- with $settings.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- include "boxmot.podSettings" $ctx | nindent 6 }}
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: postgres
          image: {{ $settings.image | quote }}
          imagePullPolicy: {{ $.Values.imagePullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          env:
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
            - name: POSTGRES_DB
              value: {{ $settings.database | quote }}
            - name: POSTGRES_USER
              value: {{ $settings.username | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret | quote }}
                  key: {{ $settings.passwordKey | quote }}
          ports:
            - {name: postgres, containerPort: 5432}
          startupProbe:
            exec:
              command: [sh, -ec, 'pg_isready -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec:
              command: [sh, -ec, 'pg_isready -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            periodSeconds: 5
          livenessProbe:
            exec:
              command: [sh, -ec, 'pg_isready -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            {{- toYaml $settings.resources | nindent 12 }}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: run, mountPath: /var/run/postgresql}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "boxmot.claimName" (dict "name" (printf "%s-data" $name) "persistence" $settings.persistence) }}
        - name: run
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "boxmot.labels" $ctx | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "boxmot.selectorLabels" $ctx | nindent 4 }}
  ports:
    - {name: postgres, port: 5432, targetPort: postgres}
{{ include "boxmot.pvc" (merge (dict "name" (printf "%s-data" $name) "persistence" $settings.persistence) $ctx) }}
{{ include "boxmot.serviceAccount" $ctx }}
{{- end }}
