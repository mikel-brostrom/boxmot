{{- if .Values.networkPolicy.enabled }}
{{- if .Values.postgres.enabled }}
{{- $ctx := dict "root" . "component" "postgres" }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "boxmot.fullname" . }}-postgres
  labels:
    {{- include "boxmot.labels" $ctx | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "boxmot.selectorLabels" $ctx | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: boxmot
              app.kubernetes.io/instance: {{ .Release.Name | quote }}
            matchExpressions:
              - key: app.kubernetes.io/component
                operator: In
                values: [camera, maintenance, output-maintenance, migration]
      ports:
        - {protocol: TCP, port: 5432}
{{- end }}
{{- if .Values.vllm.enabled }}
{{- $ctx := dict "root" . "component" "vllm" }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "boxmot.fullname" . }}-vllm
  labels:
    {{- include "boxmot.labels" $ctx | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "boxmot.selectorLabels" $ctx | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: boxmot
              app.kubernetes.io/instance: {{ .Release.Name | quote }}
              app.kubernetes.io/component: camera
      ports:
        - {protocol: TCP, port: 8000}
    {{- with .Values.networkPolicy.additionalVllmIngress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
{{- end }}
