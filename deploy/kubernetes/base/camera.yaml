apiVersion: apps/v1
kind: Deployment
metadata:
  name: camera-01
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: boxmot-camera
      camera: camera-01
  template:
    metadata:
      labels:
        app: boxmot-camera
        camera: camera-01
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        runAsNonRoot: true
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: camera
          image: boxmot-runtime
          command: [boxmot, stream, --config, /etc/boxmot/stream.yaml]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          env:
            - name: BOXMOT_CAMERA_URL
              valueFrom:
                secretKeyRef:
                  name: camera-01
                  key: url
            - name: BOXMOT_ATTRIBUTES_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: attributes-database
                  key: url
            - {name: USER, value: boxmot}
            - {name: HOME, value: /opt/boxmot/models/.home}
            - {name: XDG_CACHE_HOME, value: /opt/boxmot/models/.cache}
            - {name: YOLO_CONFIG_DIR, value: /opt/boxmot/models}
            - {name: MPLCONFIGDIR, value: /opt/boxmot/models/.cache/matplotlib}
            - {name: TORCHINDUCTOR_CACHE_DIR, value: /opt/boxmot/models/.cache/torchinductor}
          ports:
            - {name: health, containerPort: 8080}
          startupProbe:
            httpGet: {path: /startupz, port: health}
            periodSeconds: 10
            failureThreshold: 180
          readinessProbe:
            httpGet: {path: /readyz, port: health}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: health}
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests: {cpu: "2", memory: 2Gi}
            limits: {cpu: "4", memory: 4Gi}
          volumeMounts:
            - {name: config, mountPath: /etc/boxmot, readOnly: true}
            - {name: outputs, mountPath: /outputs}
            - {name: models, mountPath: /opt/boxmot/models}
      volumes:
        - name: config
          configMap: {name: camera-config}
        - name: outputs
          persistentVolumeClaim: {claimName: camera-01-outputs}
        - name: models
          persistentVolumeClaim: {claimName: camera-01-models}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: camera-01-outputs
spec:
  # The maintenance Job must also mount this claim if the camera is offline.
  accessModes: [ReadWriteMany]
  resources:
    requests: {storage: 20Gi}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: camera-01-models
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: {storage: 10Gi}
