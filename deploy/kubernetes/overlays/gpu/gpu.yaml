apiVersion: apps/v1
kind: Deployment
metadata:
  name: camera-01
spec:
  template:
    spec:
      containers:
        - name: camera
          resources:
            requests: {cpu: "2", memory: 4Gi}
            limits: {cpu: "4", memory: 8Gi, nvidia.com/gpu: 1}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm
spec:
  template:
    spec:
      containers:
        - name: vllm
          env:
            - $patch: replace
            - {name: HF_HOME, value: /models/huggingface}
          args:
            - Qwen/Qwen3.5-0.8B
            - --host
            - 0.0.0.0
            - --port
            - "8000"
            - --dtype
            - auto
            - --enforce-eager
            - --gpu-memory-utilization
            - "0.8"
            - --max-model-len
            - "2048"
            - --max-num-batched-tokens
            - "2048"
            - --max-num-seqs
            - "1"
            - --mm-processor-cache-gb
            - "0"
            - --mm-processor-kwargs
            - '{"images_kwargs":{"size":{"shortest_edge":65536,"longest_edge":262144}}}'
            - --limit-mm-per-prompt
            - '{"image":1,"video":0}'
            - --reasoning-parser
            - qwen3
          resources:
            requests: {cpu: "2", memory: 8Gi}
            limits: {cpu: "4", memory: 16Gi, nvidia.com/gpu: 1}
