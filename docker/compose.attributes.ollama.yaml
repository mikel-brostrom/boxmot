# CPU tracking with Ollama; combine with compose.attributes.yaml (Compose >=2.24.4).
# Prepare and verify the model first; see docs/integrations/docker.md#ollama.
services:
  boxmot:
    depends_on: !override
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_MODEL_DIGEST: ${OLLAMA_MODEL_DIGEST:-56671c2ab9385f9cfcb404638e32cd62d88e3501d44822208363c010179a3c90}
    entrypoint:
      - python
      - -c
      - |
        import json, os, sys, urllib.request
        with urllib.request.urlopen('http://ollama:11434/api/tags', timeout=10) as response:
            models = json.load(response)['models']
        expected = os.environ['OLLAMA_MODEL_DIGEST']
        if not any(model.get('name') == 'qwen3.5:9b' and model.get('digest') == expected for model in models):
            sys.exit('Ollama qwen3.5:9b is missing or its digest differs from OLLAMA_MODEL_DIGEST. '
                     'Prepare the pinned model before tracking; see the Docker integration guide.')
        os.execvp('boxmot', ['boxmot', 'track', *sys.argv[1:]])
      - --detector
      - ${BOXMOT_DETECTOR:-yolo26n}
      - --tracker
      - ${BOXMOT_TRACKER:-bytetrack}
      - --reid
      - ${BOXMOT_REID:-osnet-x0-25-msmt17}
      - --device
      - cpu
      - --attributes
      - person-appearance-ollama
      - --attributes-host
      - http://ollama:11434
      - --save
      - --save-json
      - --project
      - /opt/boxmot/runs/${BOXMOT_RUN_NAME:-compose-ollama}

  vllm-cpu:
    profiles: !override [vllm-cpu]

  ollama:
    profiles: !override [ollama, track]
