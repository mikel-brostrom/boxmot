[project]
name = "boxmot-docker"
version = "0.0.0"
requires-python = ">=3.10,<3.14"
dependencies = []

[project.optional-dependencies]
# Full interactive CLI dependency stack. Keeping it behind an extra prevents
# either service profile from inheriting detector and evaluation packages.
cli = [
  "boxmot[yolo,trackeval]",
]
cpu = [
  "torch>=2.2.1,<3.0.0",
  "torchvision>=0.17.1,<1.0.0",
]
cu130 = [
  "torch>=2.2.1,<3.0.0",
  "torchvision>=0.17.1,<1.0.0",
]
# The GPU service runs BoxMOT from source and receives the CUDA PyTorch stack
# through the separate `cu130` selector. FileLock is a direct ReID runtime
# import; model download clients are intentionally omitted because production
# weights must be mounted at the configured path.
service-gpu = [
  "filelock>=3.13.1,<4.0.0",
  "packaging>=23.0,<27.0.0",
]

[dependency-groups]
# Minimal dependencies for the detection-to-track service. The service image
# runs BoxMOT from source after syncing only this group.
service-runtime = [
  "fastapi>=0.135.1,<1.0.0",
  "lapx<1.0.0,>=0.5.5",
  "numpy>=2.2.0",
  "opencv-python-headless<5.0.0,>=4.7.0",
  "pydantic>=2.5.0,<2.12.0",
  "pyyaml>=6.0.0,<7.0.0",
  "rich>=15.0.0",
  "scipy>=1.11.0,<2.0.0",
  "uvicorn>=0.44.0,<1.0.0",
]

[tool.uv]
package = false
preview = true
conflicts = [
  [
    { extra = "cpu" },
    { extra = "cu130" },
  ],
]
extra-build-dependencies = { yolox = ["setuptools", { requirement = "torch", match-runtime = true }] }

# Override YOLOX's outdated dependency metadata without changing the published
# BoxMOT package metadata.
[[tool.uv.dependency-metadata]]
name = "yolox"
version = "0.3.0"
requires-dist = [
  "onnx>=1.17.0",
  "onnxsim>=0.4.33,<0.5 ; python_version < '3.12'",
  "onnxsim-prebuilt>=0.4.36.post1 ; python_version >= '3.12'",
  "tabulate",
]

[tool.uv.sources]
boxmot = { path = ".." }
torch = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu130", extra = "cu130" },
]
torchvision = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu130", extra = "cu130" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
