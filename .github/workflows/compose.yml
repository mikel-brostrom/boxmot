name: Compose integration

on:
  pull_request:
    paths:
      - 'docker/**'
      - '.dockerignore'
      - 'boxmot/engine/tracking/**'
      - 'boxmot/attributes/**'
      - 'boxmot/configs/attributes/**'
      - 'boxmot/engine/commands/**'
      - 'boxmot/engine/config/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'tests/ci/compose_contract.py'
      - 'tests/e2e/**'
      - '.github/workflows/compose.yml'
  push:
    branches: [master]
    paths:
      - 'docker/**'
      - '.dockerignore'
      - 'boxmot/engine/tracking/**'
      - 'boxmot/attributes/**'
      - 'boxmot/configs/attributes/**'
      - 'boxmot/engine/commands/**'
      - 'boxmot/engine/config/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'tests/ci/compose_contract.py'
      - 'tests/e2e/**'
      - '.github/workflows/compose.yml'
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compose-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  configuration:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: docker compose version
      - run: python -m tests.ci.compose_contract

  cpu-inference:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: configuration
    runs-on: ${{ vars.BOXMOT_COMPOSE_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 150
    env:
      BOXMOT_TEST_PROJECT: boxmot-e2e-ci-${{ github.run_id }}-${{ github.run_attempt }}
      BOXMOT_TEST_VLLM_CACHE_VOLUME: boxmot-ci-vllm-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: docker/setup-buildx-action@v3
      - name: Free unused hosted-runner SDK space
        if: runner.environment == 'github-hosted'
        run: sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet
      - name: Check capacity and install fixture encoder
        run: |
          python - <<'PY'
          import shutil
          from pathlib import Path
          memory = int(Path('/proc/meminfo').read_text().split('MemTotal:')[1].split()[0]) * 1024
          assert memory >= 12 * 1024**3, 'Use BOXMOT_COMPOSE_RUNNER with at least 12 GiB RAM'
          assert shutil.disk_usage('.').free >= 25 * 1024**3, 'Compose inference needs 25 GiB free disk'
          PY
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg
      - name: Real CPU tracking and streaming recovery
        timeout-minutes: 120
        run: python -m tests.e2e.compose_attributes --profile cpu
      - name: Stop this job's containers after interruption
        if: always()
        run: |
          override="runs/$BOXMOT_TEST_PROJECT/override.json"
          if [ -f "$override" ]; then
            docker compose --profile '*' -p "$BOXMOT_TEST_PROJECT" \
              -f docker/compose.attributes.yaml -f "$override" down --timeout 30 --volumes
          fi
          if docker volume inspect "$BOXMOT_TEST_VLLM_CACHE_VOLUME" >/dev/null 2>&1; then
            docker volume rm "$BOXMOT_TEST_VLLM_CACHE_VOLUME"
          fi
      - name: Retain inference evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compose-cpu-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            runs/boxmot-e2e-*/result.json
            runs/boxmot-e2e-*/*.log
            runs/boxmot-e2e-*/finite/**/*.jsonl
            runs/boxmot-e2e-*/streams/**/*.jsonl*
          if-no-files-found: warn
          retention-days: 14
