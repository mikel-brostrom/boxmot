name: Benchmark

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  UV_TORCH_BACKEND: cpu
  UV_INDEX_STRATEGY: unsafe-best-match
  HF_TOKEN: ${{ secrets.HF_TOKEN }}

permissions:
  contents: read

jobs:
  published-metric-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Verify published AABB and OBB native metric parity
        run: >-
          python3 .github/scripts/tracker_benchmark_results.py verify-readme
          --readme README.md
          --tolerance 0.25

  download-dataset:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore HF benchmark cache
        id: cache-restore
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: >-
            hf-mot17-parquet-${{ hashFiles('boxmot/configs/datasets/mot17.yaml',
            'boxmot/configs/artifacts/mot17.yaml') }}
          restore-keys: |
            hf-mot17-parquet-

      - name: Download MOT17 dataset and evaluation caches
        if: steps.cache-restore.outputs.cache-hit != 'true'
        run: |
          python -m pip install 'huggingface_hub<1.17'
          python - <<'PY'
          from huggingface_hub import snapshot_download

          snapshot_download(
              repo_id="Lekim89/mot17-parquet",
              repo_type="dataset",
              allow_patterns=["images/train/**", "data/**"],
          )
          snapshot_download(
              repo_id="Lekim89/runs",
              repo_type="dataset",
              allow_patterns=["runs/dets_n_embs/mot17/ablation/**"],
          )
          PY

  mot-metrics-benchmark:
    runs-on: ubuntu-latest
    needs: download-dataset
    strategy:
      fail-fast: false
      matrix:
        # Nine Python cells plus all five available native C++ cells.
        tracker:
          - occluboost
          - botsort
          - boosttrack
          - strongsort
          - deepocsort
          - bytetrack
          - hybridsort
          - ocsort
          - sfsort
        backend: [python, cpp]
        exclude:
          - tracker: boosttrack
            backend: cpp
          - tracker: strongsort
            backend: cpp
          - tracker: deepocsort
            backend: cpp
          - tracker: hybridsort
            backend: cpp
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install requirements
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libopencv-dev libeigen3-dev
          bash .github/scripts/uv_ci_install.sh ".[yolo]"

      - name: Restore HF benchmark cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/huggingface/hub
          key: >-
            hf-mot17-parquet-${{ hashFiles('boxmot/configs/datasets/mot17.yaml',
            'boxmot/configs/artifacts/mot17.yaml') }}
          fail-on-cache-miss: true

      - name: Evaluate tracker metrics
        env:
          TRACKER: ${{ matrix.tracker }}
          TRACKER_BACKEND: ${{ matrix.backend }}
        run: |
          set -euo pipefail
          source .venv/bin/activate

          boxmot eval \
            --classes 0 \
            --detector yolox_x_MOT17_ablation.pt \
            --reid lmbn_n_duke.pt \
            --tracker "$TRACKER" \
            --tracker-backend "$TRACKER_BACKEND" \
            --ci \
            --verbose \
            --experiment mot17-ablation-yolox-lmbn

          python .github/scripts/tracker_benchmark_results.py record \
            --benchmark mot17-aabb \
            --tracker "$TRACKER" \
            --backend "$TRACKER_BACKEND" \
            --metrics-file "${TRACKER}_output.json" \
            --output "results/mot17-aabb_${TRACKER}_${TRACKER_BACKEND}.json"

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: >-
            tracker-result-mot17-aabb-${{ matrix.tracker }}-${{ matrix.backend }}
          path: >-
            results/mot17-aabb_${{ matrix.tracker }}_${{ matrix.backend }}.json
          if-no-files-found: error
          retention-days: 7

  combine-results:
    runs-on: ubuntu-latest
    needs: mot-metrics-benchmark
    if: always()
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all result artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: tracker-result-mot17-aabb-*
          path: results
          merge-multiple: true

      - name: Enforce native parity and update MOT17 results
        run: |
          set -euo pipefail
          python .github/scripts/tracker_benchmark_results.py combine \
            --benchmark mot17-aabb \
            --results-dir results \
            --readme README.md \
            --csv combined_results.csv \
            --tolerance 0.25

      - name: Show validated results
        run: cat combined_results.csv

      - name: Upload validated combined results
        uses: actions/upload-artifact@v4
        with:
          name: tracker-results-mot17-validated
          path: combined_results.csv
          retention-days: 30

      - name: Check for README changes
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: check-changes
        run: |
          if git diff --quiet README.md; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create benchmark update pull request
        if: >-
          github.event_name == 'push' && github.ref == 'refs/heads/main' &&
          steps.check-changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          add-paths: README.md
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: update-tracker-results
          delete-branch: true
          commit-message: "docs: update benchmark results"
          title: "docs: update benchmark results"
          body: >-
            Updates canonical MOT17 AABB metrics after all native C++ HOTA,
            MOTA, and IDF1 differences passed the 0.25 percentage-point gate.
