name: Benchmark

on:
  workflow_dispatch:

env:
  HF_TOKEN: ${{ secrets.HF_TOKEN }}

permissions:
  contents: read

jobs:
  published-metric-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Verify published AABB and OBB native metric parity
        run: >-
          python3 .github/scripts/tracker_benchmark_results.py verify-readme
          --readme README.md
          --tolerance 0.25

  download-dataset:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore HF benchmark cache
        id: cache-restore
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: >-
            hf-mot17-parquet-${{ hashFiles('boxmot/configs/datasets/mot17.yaml') }}
          restore-keys: |
            hf-mot17-parquet-

      - name: Download MOT17 dataset
        if: steps.cache-restore.outputs.cache-hit != 'true'
        run: |
          python -m pip install 'huggingface_hub<1.17'
          python - <<'PY'
          from huggingface_hub import snapshot_download

          snapshot_download(
              repo_id="Lekim89/mot17-parquet",
              repo_type="dataset",
              allow_patterns=["images/train/**", "data/**"],
          )
          PY

  mot-metrics-benchmark:
    runs-on: ubuntu-latest
    needs: download-dataset
    strategy:
      fail-fast: false
      matrix:
        # Nine Python cells plus all five available native C++ cells.
        tracker:
          - occluboost
          - botsort
          - boosttrack
          - strongsort
          - deepocsort
          - bytetrack
          - hybridsort
          - ocsort
          - sfsort
        backend: [python, cpp]
        exclude:
          - tracker: boosttrack
            backend: cpp
          - tracker: strongsort
            backend: cpp
          - tracker: deepocsort
            backend: cpp
          - tracker: hybridsort
            backend: cpp
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python and uv
        uses: ./.github/actions/setup-ci-python
        with:
          python-version: '3.12'

      - name: Install native build dependencies
        uses: ./.github/actions/install-ubuntu-packages
        with:
          packages: cmake g++ libopencv-dev libeigen3-dev

      - name: Install requirements
        run: |
          uv sync --locked --no-default-groups --extra cpu --extra yolo

      - name: Restore HF benchmark cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/huggingface/hub
          key: >-
            hf-mot17-parquet-${{ hashFiles('boxmot/configs/datasets/mot17.yaml') }}
          fail-on-cache-miss: true

      - name: Stage MOT17 ablation layout
        shell: bash
        run: |
          set -euo pipefail
          DATA_ROOT="$RUNNER_TEMP/boxmot-data"
          export DATA_ROOT
          .venv/bin/python - <<'PY'
          from __future__ import annotations

          import csv
          import os
          from pathlib import Path

          import pyarrow.parquet as pq
          from huggingface_hub import snapshot_download

          snapshot = Path(
              snapshot_download(
                  repo_id="Lekim89/mot17-parquet",
                  repo_type="dataset",
                  allow_patterns=["images/train/**", "data/**"],
                  local_files_only=True,
              )
          )
          dataset_root = Path(os.environ["DATA_ROOT"]) / "MOT17"
          split_root = dataset_root / "ablation"
          seqinfo_rows = pq.read_table(snapshot / "data/seqinfo/seqinfo.parquet").to_pylist()
          gt_rows = pq.read_table(snapshot / "data/gt/train-00000-of-00001.parquet").to_pylist()

          gt_by_sequence: dict[str, list[dict[str, object]]] = {}
          for row in gt_rows:
              gt_by_sequence.setdefault(str(row["sequence"]), []).append(row)

          sequence_count = 0
          image_count = 0
          for sequence in seqinfo_rows:
              if str(sequence["split"]) != "train":
                  continue
              sequence_name = str(sequence["sequence"])
              sequence_length = int(sequence["seq_length"])
              first_source_frame = sequence_length // 2 + 2
              ablation_length = sequence_length - first_source_frame + 1
              output_name = f"{sequence_name}-FRCNN"
              output_root = split_root / output_name
              image_root = output_root / "img1"
              image_root.mkdir(parents=True, exist_ok=True)

              source_images = snapshot / "images/train" / sequence_name / "img1"
              for output_frame, source_frame in enumerate(
                  range(first_source_frame, sequence_length + 1), start=1
              ):
                  source = source_images / f"{source_frame:06d}.jpg"
                  if not source.is_file():
                      raise FileNotFoundError(f"Missing cached MOT17 image: {source}")
                  destination = image_root / f"{output_frame:06d}.jpg"
                  if not destination.exists():
                      destination.symlink_to(source.resolve())
                  image_count += 1

              (output_root / "seqinfo.ini").write_text(
                  "\n".join(
                      (
                          "[Sequence]",
                          f"name={output_name}",
                          "imDir=img1",
                          f"frameRate={int(sequence['fps'])}",
                          f"seqLength={ablation_length}",
                          f"imWidth={int(sequence['width'])}",
                          f"imHeight={int(sequence['height'])}",
                          "imExt=.jpg",
                          "",
                      )
                  )
              )

              ground_truth_root = output_root / "gt"
              ground_truth_root.mkdir(parents=True, exist_ok=True)
              with (ground_truth_root / "gt.txt").open("w", newline="") as stream:
                  writer = csv.writer(stream, lineterminator="\n")
                  for row in gt_by_sequence.get(sequence_name, ()):
                      source_frame = int(row["frame"])
                      if not first_source_frame <= source_frame <= sequence_length:
                          continue
                      writer.writerow(
                          (
                              source_frame - first_source_frame + 1,
                              int(row["track_id"]),
                              row["bbox_left"],
                              row["bbox_top"],
                              row["bbox_width"],
                              row["bbox_height"],
                              row["conf"],
                              int(row["class_id"]),
                              row["visibility"],
                          )
                      )
              sequence_count += 1

          if sequence_count == 0 or image_count == 0:
              raise RuntimeError("Cached MOT17 snapshot did not contain a usable train split")
          print(f"Staged {image_count} ablation frames across {sequence_count} sequences at {split_root}")
          PY
          echo "BOXMOT_BENCHMARK_DATA_ROOT=$DATA_ROOT" >> "$GITHUB_ENV"

      - name: Evaluate tracker metrics
        env:
          TRACKER: ${{ matrix.tracker }}
          TRACKER_BACKEND: ${{ matrix.backend }}
        run: |
          set -euo pipefail
          source .venv/bin/activate

          BUILD_ROOT="$RUNNER_TEMP/boxmot-builds"
          boxmot materialize \
            --experiment mot17/ablation-yolox-lmbn.yaml \
            --data-root "$BOXMOT_BENCHMARK_DATA_ROOT" \
            --build-root "$BUILD_ROOT"
          BUILD_MANIFEST=$(find "$BUILD_ROOT" -mindepth 2 -maxdepth 2 -type f -name manifest.json -print -quit)
          test -n "$BUILD_MANIFEST"
          BUILD_PATH=$(dirname "$BUILD_MANIFEST")

          boxmot eval \
            --experiment mot17/ablation-yolox-lmbn.yaml \
            --build "$BUILD_PATH" \
            --data-root "$BOXMOT_BENCHMARK_DATA_ROOT" \
            --tracker "$TRACKER" \
            --tracker-backend "$TRACKER_BACKEND" \
            --ci \
            --verbose

          python .github/scripts/tracker_benchmark_results.py record \
            --benchmark mot17-aabb \
            --tracker "$TRACKER" \
            --backend "$TRACKER_BACKEND" \
            --metrics-file "${TRACKER}_output.json" \
            --output "results/mot17-aabb_${TRACKER}_${TRACKER_BACKEND}.json"

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: >-
            tracker-result-mot17-aabb-${{ matrix.tracker }}-${{ matrix.backend }}
          path: >-
            results/mot17-aabb_${{ matrix.tracker }}_${{ matrix.backend }}.json
          if-no-files-found: error
          retention-days: 7

  combine-results:
    runs-on: ubuntu-latest
    needs: mot-metrics-benchmark
    if: always()
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all result artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: tracker-result-mot17-aabb-*
          path: results
          merge-multiple: true

      - name: Enforce native parity and update MOT17 results
        run: |
          set -euo pipefail
          python .github/scripts/tracker_benchmark_results.py combine \
            --benchmark mot17-aabb \
            --results-dir results \
            --readme README.md \
            --csv combined_results.csv \
            --tolerance 0.25

      - name: Show validated results
        run: cat combined_results.csv

      - name: Upload validated combined results
        uses: actions/upload-artifact@v4
        with:
          name: tracker-results-mot17-validated
          path: combined_results.csv
          retention-days: 30

      - name: Check for README changes
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        id: check-changes
        run: |
          if git diff --quiet README.md; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create benchmark update pull request
        if: >-
          github.event_name == 'push' && github.ref == 'refs/heads/master' &&
          steps.check-changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          add-paths: README.md
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: update-tracker-results
          delete-branch: true
          commit-message: "docs: update benchmark results"
          title: "docs: update benchmark results"
          body: >-
            Updates canonical MOT17 AABB metrics after all native C++ HOTA,
            MOTA, and IDF1 differences passed the 0.25 percentage-point gate.
