name: Update Dependencies

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-dependencies:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.12.4'
          enable-cache: true

      - name: Update lockfile
        run: uv lock --upgrade

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: dependabot/update-dependencies
          commit-message: "deps: update locked dependencies"
          title: "deps: update locked dependencies"
          body: "Updates the uv lockfile using the repository-pinned uv release."
          add-paths: uv.lock
          delete-branch: true
