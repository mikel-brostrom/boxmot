name: Docker Image CI

on:
  pull_request:
    paths:
      - .dockerignore
      - .github/workflows/docker.yml
      - boxmot/**
      - docker/**
      - pyproject.toml
      - uv.lock
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: cli
            repository: boxmot/boxmot
          - target: service
            repository: boxmot/boxmot-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract version from pyproject.toml
        id: extract_version
        run: |
          version=$(python3 -c 'import tomllib, sys; data = tomllib.loads(open("pyproject.toml","r", encoding="utf-8").read()); sys.stdout.write(data["project"]["version"])')
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Build and push ${{ matrix.target }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile
          target: ${{ matrix.target }}
          load: ${{ github.event_name == 'pull_request' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ matrix.repository }}:${{ env.VERSION }}
            ${{ matrix.repository }}:latest
            ${{ matrix.repository }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}

      - name: Smoke test CLI image
        if: github.event_name == 'pull_request' && matrix.target == 'cli'
        run: docker run --rm ${{ matrix.repository }}:${{ env.VERSION }} boxmot --help

      - name: Smoke test service image
        if: github.event_name == 'pull_request' && matrix.target == 'service'
        run: |
          docker run --rm --detach \
            --name boxmot-service-smoke \
            --publish 8000:8000 \
            ${{ matrix.repository }}:${{ env.VERSION }}
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/healthz; then
              exit 0
            fi
            sleep 1
          done
          docker logs boxmot-service-smoke
          exit 1

      - name: Stop service smoke container
        if: always() && github.event_name == 'pull_request' && matrix.target == 'service'
        run: docker stop boxmot-service-smoke || true
