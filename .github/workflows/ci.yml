# name of the workflow, what it is doing (optional)
name: BoxMOT CI

# events that trigger the workflow (required)
on:
  push:
    # pushes to the following branches
    branches:
      - master
  pull_request:
    # pull request where master is target
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CUDA_VISIBLE_DEVICES: ""


jobs:
  trackers:
    runs-on: ${{ matrix.os }}
    outputs:
      status: ${{ job.status }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]   # skip windows-latest for
        python-version: ['3.12']
    env:
      TRACKERS: "ocsort bytetrack botsort deepocsort strongsort boosttrack occluboost hybridsort sfsort"
      REID_TRACKERS: "botsort deepocsort strongsort boosttrack occluboost hybridsort"
      IMG: ./assets/MOT17-mini/train/MOT17-02-FRCNN/img1/000001.jpg

    # Timeout: https://stackoverflow.com/a/59076067/4521646
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4  # Check out the repository
      - name: Set up Python
        uses: ./.github/actions/setup-ci-python
        with:
          python-version: ${{ matrix.python-version }}
      - uses: ./.github/actions/prepare-ci-assets
      - name: Install requirements
        shell: bash  # for Windows compatibility
        run: |
          uv sync --locked --no-default-groups --extra cpu --extra yolo
      - name: Run tracking method
        run: |
          source .venv/bin/activate
          for tracker in $TRACKERS; do
            track_args=(boxmot track --detector "$BOXMOT_CI_DETECTOR" --imgsz 320 --tracker "$tracker" --source "$IMG" --verbose)
            if echo " $REID_TRACKERS " | grep -q " $tracker "; then
              track_args+=(--reid osnet_x0_25_msmt17.pt)
            fi
            "${track_args[@]}"
          done

  native_build:
    runs-on: ubuntu-latest
    outputs:
      status: ${{ job.status }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install native build dependencies
        uses: ./.github/actions/install-ubuntu-packages
        with:
          packages: cmake g++ libopencv-dev libeigen3-dev
      - name: Configure native trackers
        shell: bash
        run: |
          cmake -S boxmot/native/cpp -B build/native/trackers -DCMAKE_BUILD_TYPE=Release
      - name: Build native trackers
        shell: bash
        run: |
          cmake --build build/native/trackers --config Release --parallel

  cpp_trackers:
    # Smoke-test the C++ tracker backends via ``boxmot track --tracker-backend cpp``.
    # Ensures the native shared libraries built by scikit-build-core are loadable
    # and produce results for every tracker that exposes a cpp implementation.
    runs-on: ${{ matrix.os }}
    outputs:
      status: ${{ job.status }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
        python-version: ['3.12']
    env:
      CPP_TRACKERS: "ocsort bytetrack botsort sfsort occluboost"
      REID_TRACKERS: "botsort occluboost"
      IMG: ./assets/MOT17-mini/train/MOT17-02-FRCNN/img1/000001.jpg
      CMAKE_ARGS: "-DBOXMOT_REQUIRE_NATIVE=ON"
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: ./.github/actions/setup-ci-python
        with:
          python-version: ${{ matrix.python-version }}
      - uses: ./.github/actions/prepare-ci-assets
      - name: Install native build dependencies (Linux)
        if: runner.os == 'Linux'
        uses: ./.github/actions/install-ubuntu-packages
        with:
          packages: cmake g++ libopencv-dev libeigen3-dev
      - name: Install native build dependencies (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew install cmake opencv@4 eigen onnxruntime
          echo "CMAKE_PREFIX_PATH=$(brew --prefix opencv@4):$(brew --prefix eigen):$(brew --prefix onnxruntime)" >> "$GITHUB_ENV"
      - name: Install boxmot with native extension
        shell: bash
        run: |
          uv sync --locked --no-default-groups --extra cpu --extra yolo --group test
      - name: Verify native libraries are present
        shell: bash
        run: |
          source .venv/bin/activate
          boxmot build
          python - <<'PY'
          from boxmot.trackers.common.registry import supported_native_trackers
          names = supported_native_trackers()
          print("Registered cpp backends:", list(names))
          assert names == ("botsort", "bytetrack", "occluboost", "ocsort", "sfsort")
          PY
      - name: Run native unit tests
        if: runner.os == 'Linux'
        shell: bash
        run: |
          .venv/bin/python -m pytest -q tests/unit/native
      - name: Run cpp tracking method
        shell: bash
        run: |
          source .venv/bin/activate
          for tracker in $CPP_TRACKERS; do
            track_args=(boxmot track --detector "$BOXMOT_CI_DETECTOR" --imgsz 320 \
                        --tracker "$tracker" --tracker-backend cpp \
                        --source "$IMG" --verbose)
            if echo " $REID_TRACKERS " | grep -q " $tracker "; then
              track_args+=(--reid osnet_x0_25_msmt17.pt)
            fi
            echo "::group::cpp $tracker"
            "${track_args[@]}"
            echo "::endgroup::"
          done

  materialize:
    runs-on: ubuntu-latest
    outputs:
      status: ${{ job.status }}
    timeout-minutes: 20
    env:
      BUILD_ROOT: ${{ github.workspace }}/ci-materialization
      DATA_ROOT: ${{ github.workspace }}/assets
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        id: python
        uses: ./.github/actions/setup-ci-python
        with:
          python-version: '3.12'
      - name: Restore materialization cache
        uses: actions/cache@v4
        with:
          path: |
            ci-materialization
            models/yolo26n.pt
            models/lmbn_n_duke.pt
          key: boxmot-ci-materialization-v1-${{ runner.os }}-${{ runner.arch }}-py${{ steps.python.outputs.python-version }}-${{ hashFiles('uv.lock', 'pyproject.toml', 'boxmot/**', 'assets/MOT17-mini/**', '.github/workflows/ci.yml', '.github/actions/setup-ci-python/**', '.github/actions/prepare-ci-assets/**', '.github/scripts/fetch_ci_asset.sh', '.github/scripts/prepare_ci_assets.sh') }}
      - uses: ./.github/actions/prepare-ci-assets
      - name: Install requirements
        shell: bash
        run: |
          uv sync --locked --no-default-groups --extra cpu --extra yolo
      - name: Materialize or validate MOT17-mini detections and embeddings
        shell: bash
        run: |
          source .venv/bin/activate
          boxmot materialize --experiment mot17-mini/train-yolo26n-lmbn.yaml \
            --data-root "$DATA_ROOT" \
            --build-root "$BUILD_ROOT"
      - name: Locate validated materialization
        shell: bash
        run: |
          mapfile -t BUILD_MANIFESTS < <(
            find "$BUILD_ROOT" -mindepth 2 -maxdepth 2 -type f -name manifest.json -print
          )
          test "${#BUILD_MANIFESTS[@]}" -eq 1
          BUILD_MANIFEST="${BUILD_MANIFESTS[0]}"
          BUILD_PATH=$(dirname "$BUILD_MANIFEST")
          test -f "$BUILD_PATH/_SUCCESS"
          test -f models/yolo26n.pt
          test -f models/lmbn_n_duke.pt
      - name: Upload materialization bundle
        uses: actions/upload-artifact@v4
        with:
          name: mot17-mini-materialization
          path: |
            ci-materialization
            models/yolo26n.pt
            models/lmbn_n_duke.pt
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  tune:
    needs: materialize
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]   # skip windows-latest for
        python-version: ['3.10', '3.12']
    outputs:
      status: ${{ job.status }}

    # Timeout: https://stackoverflow.com/a/59076067/4521646
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4  # Check out the repository
      - name: Set up Python
        uses: ./.github/actions/setup-ci-python
        with:
          python-version: ${{ matrix.python-version }}
      - name: Download materialization bundle
        uses: actions/download-artifact@v4
        with:
          name: mot17-mini-materialization
          path: ${{ github.workspace }}

      - name: Install requirements
        shell: bash  # for Windows compatibility
        run: |
          uv sync --locked --no-default-groups --extra cpu --extra yolo --extra evolve
      - name: Load materialized detections and embeddings
        run: |
          BUILD_ROOT="$GITHUB_WORKSPACE/ci-materialization"
          DATA_ROOT="$GITHUB_WORKSPACE/assets"
          BUILD_MANIFEST=$(find "$BUILD_ROOT" -mindepth 2 -maxdepth 2 -type f -name manifest.json -print -quit)
          test -n "$BUILD_MANIFEST"
          BUILD_PATH=$(dirname "$BUILD_MANIFEST")
          test -f "$BUILD_PATH/_SUCCESS"
          echo "BOXMOT_CI_BUILD=$BUILD_PATH" >> "$GITHUB_ENV"
          echo "BOXMOT_CI_DATA_ROOT=$DATA_ROOT" >> "$GITHUB_ENV"
      - name: Evolve set of parameters for selected tracking method
        run: |
          source .venv/bin/activate
          boxmot tune --experiment mot17-mini/train-yolo26n-lmbn.yaml --build "$BOXMOT_CI_BUILD" \
            --data-root "$BOXMOT_CI_DATA_ROOT" \
            --n-trials 3 --tracker strongsort --ci
  metrics:
    needs: materialize
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]   # skip windows-latest for
        python-version: ['3.10', '3.12']
    outputs:
      status: ${{ job.status }}
    env:
      TRACKERS: "ocsort bytetrack botsort deepocsort strongsort boosttrack occluboost hybridsort sfsort"

    # Timeout: https://stackoverflow.com/a/59076067/4521646
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4  # Check out the repository
      - name: Set up Python
        uses: ./.github/actions/setup-ci-python
        with:
          python-version: ${{ matrix.python-version }}
      - name: Download materialization bundle
        uses: actions/download-artifact@v4
        with:
          name: mot17-mini-materialization
          path: ${{ github.workspace }}

      - name: Install metric reporting dependencies
        uses: ./.github/actions/install-ubuntu-packages
        with:
          packages: jq

      - name: Install requirements
        shell: bash  # for Windows compatibility
        run: |
          uv sync --locked --no-default-groups --extra cpu --extra yolo --extra mots --extra trackeval --group test

      - name: Check metric parity with TrackEval
        shell: bash
        run: |
          .venv/bin/python -m pytest -q -s \
            tests/unit/engine/eval/test_trackeval_parity.py \
            tests/unit/engine/eval/test_mots_trackeval_parity.py \
            tests/unit/engine/eval/test_mots_metrics.py \
            tests/unit/engine/eval/test_mots_replay.py \
            tests/unit/engine/eval/test_kitti_boxes_metrics.py \
            tests/unit/engine/eval/test_kitti_mots.py

      - name: Load materialized detections and embeddings
        run: |
          source .venv/bin/activate
          BUILD_ROOT="$GITHUB_WORKSPACE/ci-materialization"
          DATA_ROOT="$GITHUB_WORKSPACE/assets"
          BUILD_MANIFEST=$(find "$BUILD_ROOT" -mindepth 2 -maxdepth 2 -type f -name manifest.json -print -quit)
          test -n "$BUILD_MANIFEST"
          BUILD_PATH=$(dirname "$BUILD_MANIFEST")
          test -f "$BUILD_PATH/_SUCCESS"
          echo "BOXMOT_CI_BUILD=$BUILD_PATH" >> "$GITHUB_ENV"
          echo "BOXMOT_CI_DATA_ROOT=$DATA_ROOT" >> "$GITHUB_ENV"

      - name: Evaluate MOT17-mini metrics
        shell: bash
        run: |
          source .venv/bin/activate
          echo "Format,Status❔,HOTA,MOTA,IDF1" > metrics.csv
          FAILED=0
          for tracker in $TRACKERS; do
            if boxmot eval --experiment mot17-mini/train-yolo26n-lmbn.yaml \
              --build "$BOXMOT_CI_BUILD" \
              --data-root "$BOXMOT_CI_DATA_ROOT" \
              --tracker "$tracker" --verbose --ci; then
              STATUS="✅"
            else
              STATUS="❌"
              FAILED=1
            fi
            if [ -f ${tracker}_output.json ]; then
              cat ${tracker}_output.json
              HOTA=$(jq -r '.HOTA' ${tracker}_output.json)
              MOTA=$(jq -r '.MOTA' ${tracker}_output.json)
              IDF1=$(jq -r '.IDF1' ${tracker}_output.json)
            else
              HOTA=""
              MOTA=""
              IDF1=""
            fi
            TRACKER_NAME=$(echo $tracker | awk '{print toupper(substr($0,1,1)) tolower(substr($0,2))}')
            echo "$TRACKER_NAME,$STATUS,$HOTA,$MOTA,$IDF1" >> metrics.csv
          done
          echo "BOXMOT_METRICS_FAILED=$FAILED" >> "$GITHUB_ENV"

      - name: Sort MOT metrics results
        shell: bash
        run: |
          cp metrics.csv results.csv
          (head -n 1 results.csv && tail -n +2 results.csv | sort -t, -k3 -nr) > sorted_results.csv
          column -s, -t sorted_results.csv > pretty_results.txt
      - name: Show Results
        shell: bash
        run: |
          cat pretty_results.txt
          {
            echo "## MOT17-mini Metrics"
            echo
            echo '| Tracker | Status | HOTA | MOTA | IDF1 |'
            echo '| --- | --- | --- | --- | --- |'
            tail -n +2 metrics.csv | while IFS=, read -r name status hota mota idf1; do
              echo "| $name | $status | $hota | $mota | $idf1 |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce successful tracker evaluations
        if: always()
        shell: bash
        run: |
          test "${BOXMOT_METRICS_FAILED:-1}" -eq 0

  reid:
    runs-on: ubuntu-latest
    outputs:
      status: ${{ job.status }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: ./.github/actions/setup-ci-python
        with:
          python-version: '3.12'
      - name: Install requirements
        shell: bash
        run: |
          uv sync --locked --no-default-groups --extra cpu --extra yolo
      - name: Smoke-test ReID train and eval
        shell: bash
        run: |
          source .venv/bin/activate
          boxmot train-reid \
            --model mobilenetv2_x1_0 \
            --dataset market1501 \
            --data-dir assets/reid-mini \
            --device cpu \
            --epochs 1 \
            --warmup-epochs 0 \
            --eval-interval 1 \
            --batch-size 4 \
            --p-ids 2 \
            --k-instances 2 \
            --num-workers 0 \
            --project runs/reid_ci \
            --name smoke \
            --no-pretrained
          boxmot eval-reid \
            --weights runs/reid_ci/smoke/best.pt \
            --model mobilenetv2_x1_0 \
            --dataset market1501 \
            --data-dir assets/reid-mini \
            --device cpu \
            --batch-size 2 \
            --num-workers 0 \
            --output runs/reid_ci/smoke_eval

  obb:
    runs-on: ubuntu-latest
    outputs:
      status: ${{ job.status }}
    env:
      TRACKERS: "ocsort bytetrack botsort deepocsort strongsort boosttrack occluboost hybridsort sfsort"
      REID_TRACKERS: "botsort deepocsort strongsort boosttrack occluboost hybridsort"
      EXPECTED_OBB_TRACKERS: "ocsort bytetrack botsort deepocsort strongsort boosttrack occluboost hybridsort sfsort"
      SMOKE_SOURCE: ./assets/MOT17-mini/train/MOT17-02-FRCNN/img1/000001.jpg

    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: ./.github/actions/setup-ci-python
        with:
          python-version: '3.12'
      - uses: ./.github/actions/prepare-ci-assets
        with:
          assets: obb
      - name: Install requirements
        shell: bash
        run: |
          uv sync --locked --no-default-groups --extra cpu --extra yolo
      - name: Run obb tracking method
        shell: bash
        run: |
          source .venv/bin/activate
          echo "Format,OBB,Reason" > obb.csv
          failed=0
          set +e
          for tracker in $TRACKERS; do
            log_file="${tracker}_obb.log"
            track_args=(boxmot track --detector "$BOXMOT_CI_OBB_DETECTOR" --geometry obb --tracker "$tracker" --source "$SMOKE_SOURCE")
            if echo " $REID_TRACKERS " | grep -q " $tracker "; then
              track_args+=(--reid lmbn_n_duke.pt)
            fi
            "${track_args[@]}" >"$log_file" 2>&1
            tracker_exit=$?
            if [ "$tracker_exit" -eq 0 ] && grep -q "No frames processed" "$log_file"; then
              tracker_exit=1
            fi
            if [ "$tracker_exit" -eq 0 ]; then
              OBB_STATUS="✅"
              OBB_REASON="ok"
            else
              OBB_STATUS="❌"
              if grep -q "does not support OBB detections" "$log_file"; then
                if echo " $EXPECTED_OBB_TRACKERS " | grep -q " $tracker "; then
                  OBB_REASON="expected-support-missing"
                  failed=1
                else
                  OBB_REASON="unsupported"
                fi
              else
                OBB_REASON="runtime-error"
                failed=1
              fi
            fi

            TRACKER_NAME=$(echo "$tracker" | awk '{print toupper(substr($0,1,1)) tolower(substr($0,2))}')
            echo "$TRACKER_NAME,$OBB_STATUS,$OBB_REASON" >> obb.csv
            echo "OBB smoke $tracker: $OBB_STATUS ($OBB_REASON)"

            if [ "$tracker_exit" -ne 0 ] && [ "$OBB_REASON" = "runtime-error" ]; then
              cat "$log_file"
            fi
          done
          set -e
          exit "$failed"
      - name: Show OBB Results
        if: always()
        shell: bash
        run: |
          column -s, -t obb.csv
          {
            echo "## OBB Tracker Support"
            echo
            echo '| Tracker | OBB | Reason |'
            echo '| --- | --- | --- |'
            tail -n +2 obb.csv | while IFS=, read -r name status reason; do
              echo "| $name | $status | $reason |"
            done
          } >> "$GITHUB_STEP_SUMMARY"
  pose:
    runs-on: ubuntu-latest
    outputs:
      status: ${{ job.status }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: ./.github/actions/setup-ci-python
        with:
          python-version: '3.12'
      - uses: ./.github/actions/prepare-ci-assets
        with:
          assets: pose
      - run: |
          uv sync --locked --no-default-groups --extra cpu --extra yolo
      - name: Test tracking with pose models
        env:
          IMG: ./assets/MOT17-mini/train/MOT17-02-FRCNN/img1/000001.jpg
        run:  |
          source .venv/bin/activate
          boxmot track --detector "$BOXMOT_CI_POSE_DETECTOR" --imgsz 320 --source $IMG
  yolos:
    runs-on: ubuntu-latest
    outputs:
      status: ${{ job.status }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: ./.github/actions/setup-ci-python
        with:
          python-version: '3.11'
      - uses: ./.github/actions/prepare-ci-assets
      - run: |
          uv sync --locked --no-default-groups --extra cpu --extra yolo --extra rtdetr
          # Export so that setuptools picks up clang instead of gcc
          echo "CC=clang" >> $GITHUB_ENV
          echo "CXX=clang++" >> $GITHUB_ENV
      - name: Test detector backends
        env:
          IMG: ./assets/MOT17-mini/train/MOT17-02-FRCNN/img1/000001.jpg
        run: |
          source .venv/bin/activate
          uv pip list
          boxmot track --detector "$BOXMOT_CI_DETECTOR" --imgsz 320 --source $IMG
          boxmot track --detector yolox_n.pt --imgsz 320 --source $IMG
          boxmot track --detector rtdetr_v2_r18vd --imgsz 320 --source $IMG

  seg:
    runs-on: ubuntu-latest
    outputs:
      status: ${{ job.status }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: ./.github/actions/setup-ci-python
        with:
          python-version: '3.12'
      - uses: ./.github/actions/prepare-ci-assets
        with:
          assets: seg
      - name: Install dependencies
        run: |
          uv sync --locked --no-default-groups --extra cpu --extra yolo
      - name: Test tracking with seg models
        env:
          IMG: ./assets/MOT17-mini/train/MOT17-02-FRCNN/img1/000001.jpg
          TRACKERS: "bytetrack maf_hda"
        run: |
          source .venv/bin/activate
          for tracker in $TRACKERS; do
            boxmot track --tracker "$tracker" --detector "$BOXMOT_CI_SEG_DETECTOR" --source "$IMG"
          done
  
  export:
    runs-on: ubuntu-latest
    outputs:
      status: ${{ job.status }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: ./.github/actions/setup-ci-python
        with:
          python-version: '3.12'
      - uses: ./.github/actions/prepare-ci-assets
      - name: Install dependencies
        run: |
          uv sync --locked --no-default-groups --extra cpu \
            --extra yolo \
            --extra onnx \
            --extra openvino \
            --extra tflite

      - name: Test export models
        run: | 
          source .venv/bin/activate
          boxmot export --include torchscript --include onnx --include openvino --include tflite --device cpu --batch-size 3 --dynamic
      - name: Smoke test exported engines
        if: always()
        env:
          IMG: ./assets/MOT17-mini/train/MOT17-02-FRCNN/img1/000001.jpg
        run: |
          source .venv/bin/activate
          TFLITE_MODEL=$(find models -name '*.tflite' | head -n 1)
          engines=(torchscript onnx openvino tflite)
          model_paths=(
            "models/osnet_x0_25_msmt17.torchscript"
            "models/osnet_x0_25_msmt17.onnx"
            "models/osnet_x0_25_msmt17_openvino_model"
            "$TFLITE_MODEL"
          )

          echo "Engine,Export,Inference,Model" > engine_results.csv
          failed=0

          for i in "${!engines[@]}"; do
            engine="${engines[$i]}"
            model_path="${model_paths[$i]}"
            export_status="❌"
            inference_status="❌"

            if [ -n "$model_path" ] && [ -e "$model_path" ]; then
              export_status="✅"
              if boxmot track --detector "$BOXMOT_CI_DETECTOR" --tracker strongsort --reid "$model_path" --imgsz 320 --source "$IMG"; then
                inference_status="✅"
              else
                failed=1
              fi
            else
              failed=1
            fi

            echo "$engine,$export_status,$inference_status,$model_path" >> engine_results.csv
          done

          column -s, -t engine_results.csv
          exit "$failed"
      - name: Summarize exported engines
        if: always()
        run: |
          if [ ! -f engine_results.csv ]; then
            echo "## Export and inference engines" >> "$GITHUB_STEP_SUMMARY"
            echo >> "$GITHUB_STEP_SUMMARY"
            echo "No engine summary was generated." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          successful_engines=$(awk -F, 'NR > 1 && $2 == "✅" && $3 == "✅" {print $1}' engine_results.csv)

          {
            echo "## Export and inference engines"
            echo
            if [ -n "$successful_engines" ]; then
              echo "Successful export and inference engines:"
              echo
              while IFS= read -r engine; do
                [ -n "$engine" ] && echo "- $engine"
              done <<< "$successful_engines"
            else
              echo "No engines completed both export and inference successfully."
            fi
            echo
            echo "| Engine | Export | Inference | Model |"
            echo "| --- | --- | --- | --- |"
            while IFS=, read -r engine export_status inference_status model_path; do
              if [ "$engine" = "Engine" ]; then
                continue
              fi
              echo "| $engine | $export_status | $inference_status | \`$model_path\` |"
            done < engine_results.csv
          } >> "$GITHUB_STEP_SUMMARY"

  python_api:
    runs-on: ubuntu-latest
    outputs:
      status: ${{ job.status }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: ./.github/actions/setup-ci-python
        with:
          python-version: '3.12'
      - uses: ./.github/actions/prepare-ci-assets
      - name: Install requirements
        shell: bash
        run: |
          uv sync --locked --no-default-groups --extra cpu --extra yolo --group test
      - name: Smoke-test Python API
        shell: bash
        run: |
          # Keep uv from re-resolving the CPU-only environment from the
          # profile-selected lockfile and pulling CUDA wheels back in.
          .venv/bin/python -m pytest -p no:cacheprovider -q -s --durations=5 tests/ci/python_api_smoke.py

  tests:
    runs-on: ubuntu-latest
    outputs:
      status: ${{ job.status }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: ./.github/actions/setup-ci-python
        with:
          python-version: '3.12'
      - run: |
          # The dedicated export job installs and smoke-tests export runtimes.
          # The unit suite only needs the runtime/test stacks it imports directly.
          uv sync --locked --no-default-groups --extra cpu \
            --extra yolo \
            --extra evolve \
            --extra service \
            --extra mots \
            --group test
      - name: Pytest tests  # after tracking options as this does not download models
        env:
          # directory of PyPi package to be tested
          PACKAGE_DIR: boxmot
          # minimum acceptable test coverage
          COVERAGE_FAIL_UNDER: 25
        run: |
          # CI-only integration and native tests run in their dedicated jobs.
          # Local dataset-preparation tests are opt-in.
          # Use the prepared CPU-only environment without an implicit uv sync.
          .venv/bin/python -m pytest \
            --cov="$PACKAGE_DIR" \
            --cov-report=html \
            -v -s \
            --ignore=tests/ci \
            --ignore=tests/unit/native \
            --ignore=tests/unit/tools \
            tests
          .venv/bin/python -m coverage report --fail-under="$COVERAGE_FAIL_UNDER"
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: htmlcov/
          retention-days: 14
