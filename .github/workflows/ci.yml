name: BoxMOT CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CUDA_VISIBLE_DEVICES: ""
  UV_TORCH_BACKEND: cpu
  BOXMOT_CI_IMAGE: ./assets/MOT17-mini/train/MOT17-02-FRCNN/img1/000001.jpg
  BOXMOT_CI_TRACKERS: "ocsort bytetrack botsort deepocsort strongsort boosttrack occluboost hybridsort sfsort"
  BOXMOT_CI_REID_TRACKERS: "botsort deepocsort strongsort boosttrack occluboost hybridsort"

jobs:
  trackers:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci-python
        with:
          python-version: '3.12'
          cache-profile: yolo
      - uses: ./.github/actions/prepare-ci-assets
        with:
          assets: detector reid-osnet
      - name: Install requirements
        shell: bash
        run: |
          bash .github/scripts/uv_ci_install.sh ".[yolo]"
      - name: Run tracking method
        shell: bash
        run: |
          source .venv/bin/activate
          failed=0
          for tracker in $BOXMOT_CI_TRACKERS; do
            track_args=(boxmot track --detector "$BOXMOT_CI_DETECTOR" --imgsz 320 --tracker "$tracker" --source "$BOXMOT_CI_IMAGE" --verbose)
            case " $BOXMOT_CI_REID_TRACKERS " in
              *" $tracker "*) track_args+=(--reid "$BOXMOT_CI_REID_OSNET") ;;
            esac
            echo "::group::$tracker"
            if ! "${track_args[@]}"; then
              failed=1
            fi
            echo "::endgroup::"
          done
          exit "$failed"

  cpp_trackers:
    # Smoke-test the C++ tracker backends via ``boxmot track --tracker-backend cpp``.
    # Ensures runtime CMake builds are loadable and produce results for every
    # tracker that exposes a C++ implementation.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    env:
      BOXMOT_CI_CPP_TRACKERS: "ocsort bytetrack botsort sfsort occluboost"
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci-python
        with:
          python-version: '3.12'
          cache-profile: yolo-test
      - uses: ./.github/actions/prepare-ci-assets
        with:
          # Native ONNX export is intentionally avoided on macOS GitHub runners.
          assets: ${{ runner.os == 'Linux' && 'detector reid-osnet' || 'detector' }}
      - name: Install native build dependencies (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libopencv-dev libeigen3-dev
      - name: Install native build dependencies (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew install cmake opencv eigen onnxruntime
      - name: Build native tracker umbrella (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cmake -S boxmot/native/cpp -B build/native/trackers -DCMAKE_BUILD_TYPE=Release
          cmake --build build/native/trackers --config Release --parallel
      - name: Install boxmot with native extension
        shell: bash
        run: |
          bash .github/scripts/uv_ci_install.sh ".[yolo]" --group test
      - name: Verify native libraries are present
        shell: bash
        run: |
          source .venv/bin/activate
          python - <<'PY'
          from boxmot.native.registry import (
              supported_native_live_trackers,
              get_native_live_backend,
          )
          names = supported_native_live_trackers()
          print("Registered cpp backends:", list(names))
          for name in names:
              backend = get_native_live_backend(name)
              backend.ensure_built()
              print(f"  {name}: built OK")
          PY
      - name: Run native unit tests
        if: runner.os == 'Linux'
        shell: bash
        run: |
          .venv/bin/python -m pytest -q tests/unit/native
      - name: Run cpp tracking method
        shell: bash
        run: |
          source .venv/bin/activate
          failed=0
          for tracker in $BOXMOT_CI_CPP_TRACKERS; do
            track_args=(boxmot track --detector "$BOXMOT_CI_DETECTOR" --imgsz 320 \
                        --tracker "$tracker" --tracker-backend cpp \
                        --source "$BOXMOT_CI_IMAGE" --verbose)
            if [[ "$RUNNER_OS" == "Linux" ]]; then
              case " $BOXMOT_CI_REID_TRACKERS " in
                *" $tracker "*) track_args+=(--reid "$BOXMOT_CI_REID_OSNET") ;;
              esac
            fi
            echo "::group::cpp $tracker"
            if ! "${track_args[@]}"; then
              failed=1
            fi
            echo "::endgroup::"
          done
          exit "$failed"

  tune:
    runs-on: ubuntu-latest

    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci-python
        with:
          python-version: '3.12'
          cache-profile: yolo-evolve
      - uses: ./.github/actions/prepare-ci-assets
        with:
          assets: detector reid-osnet

      - name: Install requirements
        shell: bash
        run: |
          bash .github/scripts/uv_ci_install.sh ".[yolo,evolve]"
      - name: Evolve set of parameters for selected tracking method
        run: |
          source .venv/bin/activate
          boxmot tune --detector "$BOXMOT_CI_DETECTOR" --reid "$BOXMOT_CI_REID_OSNET" --imgsz 320 --n-trials 3 --tracker strongsort --experiment mot17-mini-train-yolox-lmbn --ci --classes 0

  compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.13']
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci-python
        with:
          python-version: ${{ matrix.python-version }}
          cache-profile: core-test
      - name: Install core and test dependencies
        shell: bash
        run: bash .github/scripts/uv_ci_install.sh "." --group test
      - name: Test supported Python boundaries
        shell: bash
        run: |
          .venv/bin/python -m boxmot.engine.cli --help
          .venv/bin/python -m pytest -q \
            tests/unit/core/test_box_schema.py \
            tests/unit/trackers/test_tracker_specs.py \
            tests/unit/engine/test_cli.py

  metrics:
    runs-on: ubuntu-latest

    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci-python
        with:
          python-version: '3.12'
          cache-profile: yolo-trackeval-test
      - uses: ./.github/actions/prepare-ci-assets
        with:
          assets: detector reid-osnet

      - name: Install requirements
        shell: bash
        run: |
          bash .github/scripts/uv_ci_install.sh ".[yolo,trackeval]" --group test

      - name: Check metric parity with TrackEval
        shell: bash
        run: |
          .venv/bin/python -m pytest -q tests/unit/engine/eval/test_trackeval_parity.py

      - name: Generate detections and embeddings
        run: |
          source .venv/bin/activate
          boxmot generate --experiment mot17-mini-train-yolox-lmbn --detector "$BOXMOT_CI_DETECTOR" --reid "$BOXMOT_CI_REID_OSNET" --imgsz 320 --classes 0

      - name: Evaluate MOT17-mini metrics
        id: evaluate
        shell: bash
        run: |
          source .venv/bin/activate
          echo "Format,Status❔,HOTA,MOTA,IDF1" > metrics.csv
          failed=0
          for tracker in $BOXMOT_CI_TRACKERS; do
            output_file="${tracker}_output.json"
            if boxmot eval --detector "$BOXMOT_CI_DETECTOR" --imgsz 320 --reid "$BOXMOT_CI_REID_OSNET" --tracker "$tracker" --verbose --experiment mot17-mini-train-yolox-lmbn --ci --classes 0; then
              STATUS="✅"
            else
              STATUS="❌"
              failed=1
            fi
            if [ -f "$output_file" ]; then
              cat "$output_file"
              if metrics_values=$(.venv/bin/python -c 'import json, sys; data = json.load(open(sys.argv[1])); print(*(data.get(key, "") for key in ("HOTA", "MOTA", "IDF1")), sep="\t")' "$output_file"); then
                IFS=$'\t' read -r HOTA MOTA IDF1 <<< "$metrics_values"
              else
                HOTA=""
                MOTA=""
                IDF1=""
                STATUS="❌"
                failed=1
              fi
            else
              HOTA=""
              MOTA=""
              IDF1=""
              STATUS="❌"
              failed=1
            fi
            TRACKER_NAME="${tracker^}"
            echo "$TRACKER_NAME,$STATUS,$HOTA,$MOTA,$IDF1" >> metrics.csv
          done
          echo "failed=$failed" >> "$GITHUB_OUTPUT"

      - name: Sort MOT metrics results
        if: always() && hashFiles('metrics.csv') != ''
        shell: bash
        run: |
          cp metrics.csv results.csv
          (head -n 1 results.csv && tail -n +2 results.csv | sort -t, -k3 -nr) > sorted_results.csv
          column -s, -t sorted_results.csv > pretty_results.txt
      - name: Show Results
        if: always() && hashFiles('metrics.csv') != ''
        shell: bash
        run: |
          if [ -f pretty_results.txt ]; then
            cat pretty_results.txt
          fi
          {
            echo "## MOT17-mini Metrics"
            echo
            echo '| Tracker | Status | HOTA | MOTA | IDF1 |'
            echo '| --- | --- | --- | --- | --- |'
            tail -n +2 metrics.csv | while IFS=, read -r name status hota mota idf1; do
              echo "| $name | $status | $hota | $mota | $idf1 |"
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Enforce metric evaluation success
        if: always() && steps.evaluate.outputs.failed == '1'
        run: exit 1

  reid:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci-python
        with:
          python-version: '3.12'
          cache-profile: core
      - name: Install requirements
        shell: bash
        run: |
          bash .github/scripts/uv_ci_install.sh "."
      - name: Smoke-test ReID train and eval
        shell: bash
        run: |
          source .venv/bin/activate
          boxmot train-reid \
            --model mobilenetv2_x1_0 \
            --dataset market1501 \
            --data-dir assets/reid-mini \
            --device cpu \
            --epochs 1 \
            --warmup-epochs 0 \
            --eval-interval 1 \
            --batch-size 4 \
            --p-ids 2 \
            --k-instances 2 \
            --num-workers 0 \
            --project runs/reid_ci \
            --name smoke \
            --no-pretrained
          boxmot eval-reid \
            --weights runs/reid_ci/smoke/best.pt \
            --model mobilenetv2_x1_0 \
            --dataset market1501 \
            --data-dir assets/reid-mini \
            --device cpu \
            --batch-size 2 \
            --num-workers 0 \
            --output runs/reid_ci/smoke_eval

  obb:
    runs-on: ubuntu-latest

    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci-python
        with:
          python-version: '3.12'
          cache-profile: yolo
      - uses: ./.github/actions/prepare-ci-assets
        with:
          assets: obb reid-lmbn
      - name: Install requirements
        shell: bash
        run: |
          bash .github/scripts/uv_ci_install.sh ".[yolo]"
      - name: Run obb tracking method
        shell: bash
        run: |
          source .venv/bin/activate
          echo "Format,OBB,Reason" > obb.csv
          failed=0
          set +e
          for tracker in $BOXMOT_CI_TRACKERS; do
            log_file="${tracker}_obb.log"
            track_args=(boxmot track --detector "$BOXMOT_CI_OBB_DETECTOR" --tracker "$tracker" --source "$BOXMOT_CI_IMAGE" --project runs/ci_smoke --name "$tracker" --exist-ok)
            case " $BOXMOT_CI_REID_TRACKERS " in
              *" $tracker "*) track_args+=(--reid "$BOXMOT_CI_REID_LMBN") ;;
            esac
            "${track_args[@]}" >"$log_file" 2>&1
            tracker_exit=$?
            if [ "$tracker_exit" -eq 0 ] && grep -q "No frames processed" "$log_file"; then
              tracker_exit=1
            fi
            if [ "$tracker_exit" -eq 0 ]; then
              OBB_STATUS="✅"
              OBB_REASON="ok"
            else
              OBB_STATUS="❌"
              if grep -q "does not support OBB detections" "$log_file"; then
                OBB_REASON="expected-support-missing"
              else
                OBB_REASON="runtime-error"
              fi
              failed=1
            fi

            TRACKER_NAME=$(echo "$tracker" | awk '{print toupper(substr($0,1,1)) tolower(substr($0,2))}')
            echo "$TRACKER_NAME,$OBB_STATUS,$OBB_REASON" >> obb.csv
            echo "OBB smoke $tracker: $OBB_STATUS ($OBB_REASON)"

            if [ "$tracker_exit" -ne 0 ] && [ "$OBB_REASON" = "runtime-error" ]; then
              cat "$log_file"
            fi
          done
          set -e
          exit "$failed"
      - name: Show OBB Results
        if: always()
        shell: bash
        run: |
          column -s, -t obb.csv
          {
            echo "## OBB Tracker Support"
            echo
            echo '| Tracker | OBB | Reason |'
            echo '| --- | --- | --- |'
            tail -n +2 obb.csv | while IFS=, read -r name status reason; do
              echo "| $name | $status | $reason |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

  pose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci-python
        with:
          python-version: '3.12'
          cache-profile: yolo
      - uses: ./.github/actions/prepare-ci-assets
        with:
          assets: pose
      - run: |
          bash .github/scripts/uv_ci_install.sh ".[yolo]"
      - name: Test tracking with pose models
        run: |
          source .venv/bin/activate
          boxmot track --detector "$BOXMOT_CI_POSE_DETECTOR" --imgsz 320 --source "$BOXMOT_CI_IMAGE"

  yolos:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci-python
        with:
          python-version: '3.11'
          cache-profile: yolo-rtdetr
      - uses: ./.github/actions/prepare-ci-assets
      - name: Install detector dependencies
        env:
          CC: clang
          CXX: clang++
        run: bash .github/scripts/uv_ci_install.sh ".[yolo,rtdetr]"
      - name: Test detector backends
        run: |
          source .venv/bin/activate
          failed=0
          detectors=("$BOXMOT_CI_DETECTOR" yolox_n.pt rtdetr_v2_r18vd)
          for detector in "${detectors[@]}"; do
            echo "::group::$detector"
            if ! boxmot track --detector "$detector" --imgsz 320 --source "$BOXMOT_CI_IMAGE"; then
              failed=1
            fi
            echo "::endgroup::"
          done
          exit "$failed"

  seg:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci-python
        with:
          python-version: '3.12'
          cache-profile: yolo
      - uses: ./.github/actions/prepare-ci-assets
        with:
          assets: seg
      - name: Install dependencies
        run: |
          bash .github/scripts/uv_ci_install.sh ".[yolo]"
      - name: Test tracking with seg models
        run: |
          source .venv/bin/activate
          boxmot track --tracker bytetrack --detector "$BOXMOT_CI_SEG_DETECTOR" --source "$BOXMOT_CI_IMAGE"

  export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci-python
        with:
          python-version: '3.12'
          cache-profile: yolo-export
      - uses: ./.github/actions/prepare-ci-assets
        with:
          assets: detector reid-osnet
      - name: Install dependencies
        run: |
          bash .github/scripts/uv_ci_install.sh ".[yolo,onnx,openvino,tflite]"

      - name: Test export models
        run: |
          source .venv/bin/activate
          boxmot export --weights "$BOXMOT_CI_REID_OSNET" --include torchscript --include onnx --include openvino --include tflite --device cpu --batch-size 3 --dynamic
      - name: Smoke test exported engines
        if: always()
        run: |
          source .venv/bin/activate
          TFLITE_MODEL=$(find models -name '*.tflite' | head -n 1)
          engines=(torchscript onnx openvino tflite)
          model_paths=(
            "models/osnet_x0_25_msmt17.torchscript"
            "models/osnet_x0_25_msmt17.onnx"
            "models/osnet_x0_25_msmt17_openvino_model"
            "$TFLITE_MODEL"
          )

          echo "Engine,Export,Inference,Model" > engine_results.csv
          failed=0

          for i in "${!engines[@]}"; do
            engine="${engines[$i]}"
            model_path="${model_paths[$i]}"
            export_status="❌"
            inference_status="❌"

            if [ -n "$model_path" ] && [ -e "$model_path" ]; then
              export_status="✅"
              if boxmot track --detector "$BOXMOT_CI_DETECTOR" --tracker strongsort --reid "$model_path" --imgsz 320 --source "$BOXMOT_CI_IMAGE"; then
                inference_status="✅"
              else
                failed=1
              fi
            else
              failed=1
            fi

            echo "$engine,$export_status,$inference_status,$model_path" >> engine_results.csv
          done

          column -s, -t engine_results.csv
          exit "$failed"
      - name: Summarize exported engines
        if: always()
        run: |
          if [ ! -f engine_results.csv ]; then
            echo "## Export and inference engines" >> "$GITHUB_STEP_SUMMARY"
            echo >> "$GITHUB_STEP_SUMMARY"
            echo "No engine summary was generated." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          successful_engines=$(awk -F, 'NR > 1 && $2 == "✅" && $3 == "✅" {print $1}' engine_results.csv)

          {
            echo "## Export and inference engines"
            echo
            if [ -n "$successful_engines" ]; then
              echo "Successful export and inference engines:"
              echo
              while IFS= read -r engine; do
                [ -n "$engine" ] && echo "- $engine"
              done <<< "$successful_engines"
            else
              echo "No engines completed both export and inference successfully."
            fi
            echo
            echo "| Engine | Export | Inference | Model |"
            echo "| --- | --- | --- | --- |"
            while IFS=, read -r engine export_status inference_status model_path; do
              if [ "$engine" = "Engine" ]; then
                continue
              fi
              echo "| $engine | $export_status | $inference_status | \`$model_path\` |"
            done < engine_results.csv
          } >> "$GITHUB_STEP_SUMMARY"

  python_api:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci-python
        with:
          python-version: '3.12'
          cache-profile: yolo-test
      - uses: ./.github/actions/prepare-ci-assets
        with:
          assets: detector reid-osnet
      - name: Install requirements
        shell: bash
        run: |
          bash .github/scripts/uv_ci_install.sh ".[yolo]" --group test
      - name: Smoke-test Python API
        shell: bash
        run: |
          # Keep uv from re-resolving the CPU-only environment from the
          # platform-neutral lockfile and pulling CUDA wheels back in.
          .venv/bin/python -m pytest -p no:cacheprovider -q --durations=5 tests/ci/python_api_smoke.py

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci-python
        with:
          python-version: '3.12'
          cache-profile: yolo-test
      - run: |
          # The dedicated export job installs and smoke-tests export runtimes.
          # The unit suite only needs the runtime/test stacks it imports directly.
          bash .github/scripts/uv_ci_install.sh ".[yolo]" --group test
      - name: Run test suite
        env:
          # directory of PyPi package to be tested
          PACKAGE_DIR: boxmot
          # minimum acceptable test coverage
          COVERAGE_FAIL_UNDER: 25
        run: |
          # CI-only integration and native tests run in their dedicated jobs.
          # Local dataset-preparation and launcher tests are opt-in.
          # Use the prepared CPU-only environment without an implicit uv sync.
          .venv/bin/python -m pytest \
            --cov="$PACKAGE_DIR" \
            --cov-report=html \
            -q \
            --ignore=tests/ci \
            --ignore=tests/unit/native \
            --ignore=tests/unit/tools \
            --deselect=tests/unit/reid/backbones/csl_tinyvit/test_csl_tinyvit_7m_multilevel_suppression.py::test_multilevel_suppression_launcher_contract \
            --deselect=tests/unit/reid/backbones/csl_tinyvit/test_csl_tinyvit_7m_multilevel_suppression.py::test_multilevel_suppression_launcher_validate_only_cannot_train \
            --deselect=tests/unit/reid/backbones/csl_tinyvit/test_csl_tinyvit_7m_multilevel_suppression.py::test_multilevel_suppression_launcher_rejects_incomplete_market1501 \
            --deselect=tests/unit/reid/backbones/csl_tinyvit/test_csl_tinyvit_7m_multilevel_suppression.py::test_multilevel_suppression_launcher_rejects_empty_metadata \
            tests
          .venv/bin/python -m coverage report --fail-under="$COVERAGE_FAIL_UNDER"
      - name: Upload coverage report
        if: failure() && hashFiles('htmlcov/**') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: htmlcov/
          retention-days: 7

  check-failures:
    needs:
      - trackers
      - cpp_trackers
      - compatibility
      - metrics
      - reid
      - obb
      - tune
      - export
      - python_api
      - tests
      - pose
      - seg
      - yolos
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check for failures and create summary
        run: |
          results=(
            "trackers=${{ needs.trackers.result }}"
            "cpp_trackers=${{ needs.cpp_trackers.result }}"
            "compatibility=${{ needs.compatibility.result }}"
            "metrics=${{ needs.metrics.result }}"
            "reid=${{ needs.reid.result }}"
            "obb=${{ needs.obb.result }}"
            "tune=${{ needs.tune.result }}"
            "export=${{ needs.export.result }}"
            "python_api=${{ needs.python_api.result }}"
            "tests=${{ needs.tests.result }}"
            "pose=${{ needs.pose.result }}"
            "seg=${{ needs.seg.result }}"
            "yolos=${{ needs.yolos.result }}"
          )
          failed=false
          {
            echo "## CI Results"
            echo
            echo "| Job | Status |"
            echo "| --- | --- |"
            for entry in "${results[@]}"; do
              job="${entry%%=*}"
              status="${entry##*=}"
              if [[ "$status" == "success" ]]; then
                echo "| $job | :white_check_mark: |"
              else
                echo "| $job | :x: $status |"
                failed=true
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$failed" == "true" ]]; then
            echo "::error::One or more jobs failed"
            exit 1
          fi
