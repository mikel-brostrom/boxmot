  check-failures:
    needs:
      - trackers
      - native_build
      - cpp_trackers
      - materialize
      - metrics
      - reid
      - obb
      - tune
      - export
      - python_api
      - tests
      - pose
      - seg
      - yolos
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check for failures and create summary
        run: |
          results=(
            "trackers=${{ needs.trackers.result }}"
            "native_build=${{ needs.native_build.result }}"
            "cpp_trackers=${{ needs.cpp_trackers.result }}"
            "materialize=${{ needs.materialize.result }}"
            "metrics=${{ needs.metrics.result }}"
            "reid=${{ needs.reid.result }}"
            "obb=${{ needs.obb.result }}"
            "tune=${{ needs.tune.result }}"
            "export=${{ needs.export.result }}"
            "python_api=${{ needs.python_api.result }}"
            "tests=${{ needs.tests.result }}"
            "pose=${{ needs.pose.result }}"
            "seg=${{ needs.seg.result }}"
            "yolos=${{ needs.yolos.result }}"
          )
          failed=false
          {
            echo "## CI Results"
            echo
            echo "| Job | Status |"
            echo "| --- | --- |"
            for entry in "${results[@]}"; do
              job="${entry%%=*}"
              status="${entry##*=}"
              if [[ "$status" == "success" ]]; then
                echo "| $job | :white_check_mark: |"
              else
                echo "| $job | :x: $status |"
                failed=true
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$failed" == "true" ]]; then
            echo "::error::One or more jobs failed"
            exit 1
          fi
