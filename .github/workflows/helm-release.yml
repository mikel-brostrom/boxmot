name: Publish Helm chart

on:
  push:
    tags: ['boxmot-chart-*']
  workflow_dispatch:
    inputs:
      chart_tag:
        description: 'Existing boxmot-chart-X.Y.Z tag to publish'
        required: true
        type: string
      source_sha:
        description: 'Full commit SHA named by the existing chart tag'
        required: true
        type: string

permissions:
  contents: read

# Serialize every publication, including a manual retry and its tag event.
# The registry check must run inside this lock immediately before pushing.
concurrency:
  group: boxmot-helm-publication
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      CHART_TAG: ${{ inputs.chart_tag || github.ref_name }}
      SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: ./.github/actions/setup-helm
      - name: Install chart validation dependencies
        run: python -m pip install 'PyYAML==6.0.2' 'pytest==8.3.5'
      - name: Verify chart tag, source commit and chart version
        run: |
          mkdir -p chart-release
          python -m tests.ci.deployment_release chart \
            --tag "$CHART_TAG" --source-sha "$SOURCE_SHA" \
            --default-branch "$DEFAULT_BRANCH" --output chart-release/source.json
          echo "CHART_VERSION=${CHART_TAG#boxmot-chart-}" >> "$GITHUB_ENV"
          echo "CHART_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - name: Validate the exact chart source before packaging
        run: |
          python -m tests.ci.helm_contract
          python -m pytest -q tests/unit/test_deployment_release.py tests/unit/test_helm_streaming_harness.py
      - name: Package the validated chart
        run: |
          helm package deploy/helm/boxmot --destination chart-release
          sha256sum "chart-release/boxmot-$CHART_VERSION.tgz" > chart-release/SHA256SUMS
      - name: Authenticate Helm to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Refuse to replace an existing chart version
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m tests.ci.deployment_release unused-chart --owner "$CHART_OWNER" --version "$CHART_VERSION"
      - name: Publish the versioned OCI package
        run: |
          helm push "chart-release/boxmot-$CHART_VERSION.tgz" "oci://ghcr.io/$CHART_OWNER/charts" \
            2>&1 | tee chart-release/publish.log
          {
            echo "Published chart: oci://ghcr.io/$CHART_OWNER/charts/boxmot:$CHART_VERSION"
            echo "Chart source: $SOURCE_SHA"
            cat chart-release/publish.log
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Retain the exact chart package and publication identity
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chart-${{ env.CHART_TAG }}-${{ github.run_id }}
          path: chart-release/
          if-no-files-found: warn
          retention-days: 90
