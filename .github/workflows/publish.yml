name: Publish to PyPI

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      pypi:
        description: 'Target repository'
        required: true
        type: choice
        default: 'pypi'
        options:
          - pypi
          - testpypi
      bump_type:
        description: 'Version bump type'
        required: true
        type: choice
        default: 'patch'
        options:
          - patch
          - minor
          - major

jobs:
  pypi-upload:
    name: Publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Personal Access Token (PAT) so that git push
          # is authenticated such that you and can bypass the protected ref
          token: ${{ secrets.RELEASE_PAT }}

      - name: Set up Python environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel uv
          uv sync

      - name: Bump project version
        id: get_version
        run: |
          git config --local user.email yolov5.deepsort.pytorch@gmail.com
          git config --local user.name mikel-brostrom
          bump_type=${{ github.event.inputs.bump_type }}
          old_version=$(uv version --short)
          uv version --bump "$bump_type"
          new_version=$(uv version --short)
          commit_message="Bump version from $old_version to $new_version"
          git add pyproject.toml uv.lock
          uv build --no-sources
          echo "commit_message=$commit_message" >> $GITHUB_OUTPUT
          echo "new_version=$new_version" >> $GITHUB_OUTPUT
          du -sh dist/*
        if: ${{ success() }}

      - name: Commit and push updated version
        id: release_commit
        run: |
          if [ "${{ github.event.inputs.pypi }}" == "pypi" ]; then
            git commit -m "${{ steps.get_version.outputs.commit_message }}"
            git push
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi
        if: ${{ success() }}

      - name: Publish to PyPI
        run: |
          if [ "${{ github.event.inputs.pypi }}" == "pypi" ]; then
            uv publish --token ${{ secrets.PYPI_TOKEN }}
          else
            uv publish --index testpypi --token ${{ secrets.TEST_PYPI_TOKEN }}
          fi
        if: ${{ success() }}

      - name: Create code release
        id: create_release
        uses: actions/create-release@v1
        env:
          # A PAT is required so the release.published event can start the
          # release-only Docker workflow; GITHUB_TOKEN suppresses chained runs.
          GITHUB_TOKEN: ${{ secrets.RELEASE_PAT }}
        with:
          tag_name: v${{ steps.get_version.outputs.new_version }}
          release_name: Release v${{ steps.get_version.outputs.new_version }}
          commitish: ${{ steps.release_commit.outputs.sha }}
          draft: false
          prerelease: false
        if: ${{ success() && github.event.inputs.pypi == 'pypi' }}
